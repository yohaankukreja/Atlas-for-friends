<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Atlas</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one working page. Slim masthead with live counts, two views (Outline, Upcoming),
   outline rows in a single grid so every column lines up from project down to sub-task. */
:root{
  --bg:#f2f5f1; --surface:#ffffff; --ink:#16211b; --muted:#66736a; --line:#dde4dc; --hover:#f6f9f5;
  --accent:#2d6a4f; --accent-ink:#ffffff; --accent-soft:#e1efe7;
  --head-bg:#16211b; --head-ink:#f2f5f1; --head-muted:#9fb0a5;
  --grey-bg:#e9eee8; --grey-fg:#46534b;
  --blue-bg:#dbe8fb; --blue-fg:#1d4a8f;
  --red-bg:#fbdcd7; --red-fg:#9a2315;
  --amber-bg:#fbe9bd; --amber-fg:#7a5200;
  --green-bg:#d5ecdc; --green-fg:#1d6038;
  --font-display:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif;
  --font-body:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1411; --surface:#151c18; --ink:#e5ece6; --muted:#8a978e; --line:#26302a; --hover:#1a221d;
  --accent:#6fc39a; --accent-ink:#0e1411; --accent-soft:#1c2e25;
  --head-bg:#0a0f0c; --head-ink:#e5ece6; --head-muted:#7f8d84;
  --grey-bg:#222b25; --grey-fg:#b4c0b7;
  --blue-bg:#1b2c47; --blue-fg:#9fc3f5;
  --red-bg:#411e1a; --red-fg:#f3a79d;
  --amber-bg:#40320f; --amber-fg:#f1cf79;
  --green-bg:#173324; --green-fg:#8fd6a9; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1411; --surface:#151c18; --ink:#e5ece6; --muted:#8a978e; --line:#26302a; --hover:#1a221d;
  --accent:#6fc39a; --accent-ink:#0e1411; --accent-soft:#1c2e25;
  --head-bg:#0a0f0c; --head-ink:#e5ece6; --head-muted:#7f8d84;
  --grey-bg:#222b25; --grey-fg:#b4c0b7;
  --blue-bg:#1b2c47; --blue-fg:#9fc3f5;
  --red-bg:#411e1a; --red-fg:#f3a79d;
  --amber-bg:#40320f; --amber-fg:#f1cf79;
  --green-bg:#173324; --green-fg:#8fd6a9; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.mast{background:var(--head-bg);color:var(--head-ink);padding-block:18px 16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mast-in{max-width:1120px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.brand h1{font-family:var(--font-display);font-weight:700;font-size:26px;letter-spacing:-.01em;margin:0;line-height:1.1}
.brand p{margin:3px 0 0;color:var(--head-muted);font-family:var(--font-mono);font-size:12px}
.counts{display:flex;gap:22px;flex-wrap:wrap}
.count{display:flex;flex-direction:column;gap:1px}
.count b{font-family:var(--font-display);font-size:24px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.count span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--head-muted)}
.count.warn b{color:#f3a79d}

.wrap{max-width:1120px;margin:0 auto;padding-block:16px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.tabs,.chips{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:7px 12px;border-radius:6px;color:var(--muted);font-weight:500}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 10px;min-width:180px}
.chip-b{border:1px solid var(--line);background:transparent;border-radius:6px;padding:5px 10px;font-size:12.5px;color:var(--muted)}
.chip-b[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:500}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 11px;font-size:13px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:500}
.btn.danger{color:var(--red-fg);border-color:transparent;background:var(--red-bg)}

.sheet{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.cols,.row{display:grid;grid-template-columns:minmax(0,1fr) 112px 92px 108px 132px 68px;gap:8px;align-items:center;padding:0 12px}
.cols{height:34px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);background:var(--hover)}
.row{min-height:40px;border-bottom:1px solid var(--line)}
.row:hover{background:var(--hover)}
.row.proj{min-height:52px;background:var(--surface);border-top:1px solid var(--line)}
.row.proj .ttl{font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:-.005em}
.row.d1 .ttl{font-weight:600}
.row.d2 .ttl,.row.d3 .ttl{font-weight:400}
.row.done .ttl{color:var(--muted);text-decoration:line-through}
.c-title{display:flex;align-items:center;gap:6px;min-width:0;padding-left:calc(var(--depth) * 22px)}
.ttl{flex:1;min-width:0;border:0;background:transparent;padding:6px 4px;border-radius:4px;text-overflow:ellipsis}
.ttl:focus{background:var(--surface);box-shadow:0 0 0 1px var(--accent)}
.chev{width:22px;height:22px;border:0;background:transparent;color:var(--muted);border-radius:4px;display:grid;place-items:center;flex:none;padding:0}
.chev:hover{background:var(--grey-bg)}
.chev.ghost{visibility:hidden}
.chev svg{transition:transform .12s}
.chev[aria-expanded="false"] svg{transform:rotate(-90deg)}
.chk{width:16px;height:16px;flex:none;accent-color:var(--accent);margin:0}
.prog{width:56px;height:5px;border-radius:3px;background:var(--grey-bg);flex:none;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.pnum{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.chip{font-size:11.5px;text-decoration:none;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);flex:none}
.mdue{display:none}

select.pill{appearance:none;-webkit-appearance:none;border:0;border-radius:999px;padding:3px 12px;font-size:12px;font-weight:500;cursor:pointer;max-width:100%;text-align:center;text-align-last:center}
.s-backlog,.s-todo{background:var(--grey-bg);color:var(--grey-fg)}
.s-inprogress{background:var(--blue-bg);color:var(--blue-fg)}
.s-blocked{background:var(--red-bg);color:var(--red-fg)}
.s-done{background:var(--green-bg);color:var(--green-fg)}
.p-high{background:var(--red-bg);color:var(--red-fg)}
.p-medium{background:var(--amber-bg);color:var(--amber-fg)}
.p-low{background:var(--green-bg);color:var(--green-fg)}
.p-none{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.o-sel{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
input.date{border:0;background:transparent;font-family:var(--font-mono);font-size:12px;padding:3px 2px;border-radius:4px;width:100%;color:var(--muted)}
input.date.over{color:var(--red-fg);font-weight:600}
input.date.soon{color:var(--amber-fg);font-weight:600}
.c-act{display:flex;gap:2px;justify-content:flex-end;opacity:0}
.row:hover .c-act,.row:focus-within .c-act,.row.open .c-act{opacity:1}
@media (hover:none){.c-act{opacity:1}}
.ib{width:28px;height:28px;border:0;background:transparent;border-radius:6px;display:grid;place-items:center;color:var(--muted);padding:0}
.ib:hover{background:var(--grey-bg);color:var(--ink)}

.detail{display:grid;grid-template-columns:2fr 1fr;gap:14px;padding:12px 16px 16px;border-bottom:1px solid var(--line);background:var(--hover)}
.detail label{display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.detail textarea,.detail input[type=text]{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 10px;font-size:13.5px;text-transform:none;letter-spacing:0;color:var(--ink);width:100%}
.detail textarea{min-height:84px;resize:vertical}
.d-side{display:flex;flex-direction:column;gap:10px;min-width:0}
.d-meta{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.d-act{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}

.add-row{display:flex;padding:8px 12px}
.add-row .btn{border-style:dashed;color:var(--muted)}

.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty h2{font-family:var(--font-display);color:var(--ink);margin:0 0 6px;font-size:20px}

.up-group{margin-bottom:18px}
.up-group h3{font-family:var(--font-display);font-size:15px;margin:0 0 8px;display:flex;gap:8px;align-items:baseline}
.up-group h3 small{font-family:var(--font-mono);font-weight:400;color:var(--muted);font-size:12px}
.up-item{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:6px}
.up-date{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.up-date.over{color:var(--red-fg);font-weight:600}
.up-t{min-width:0}
.up-t b{font-weight:600;display:block;overflow-wrap:anywhere}
.up-t span{color:var(--muted);font-size:12.5px}
.up-item a{white-space:nowrap;font-size:13px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--head-bg);color:var(--head-ink);padding:9px 14px;border-radius:8px;font-size:13px;max-width:90vw;z-index:9}

@media (max-width:760px){
  .cols .h-pr,.cols .h-ow,.cols .h-due,.c-pr,.c-ow,.c-due{display:none}
  .cols,.row{grid-template-columns:minmax(0,1fr) 104px 64px}
  .c-title{flex-wrap:wrap}
  .mdue{display:block;flex-basis:100%;padding-left:calc(28px + var(--depth) * 0px);font-family:var(--font-mono);font-size:11.5px;color:var(--muted)}
  .mdue.over{color:var(--red-fg)}
  .detail{grid-template-columns:1fr}
  .up-item{grid-template-columns:minmax(0,1fr);gap:4px}
  .search{min-width:0;flex:1}
  .counts{gap:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.crow{display:grid;grid-template-columns:minmax(0,1fr) 120px 128px 96px 68px;gap:8px;align-items:center;padding:0 12px;min-height:44px;border-bottom:1px solid var(--line)}
.crow:hover{background:var(--hover)}
.crow .ttl{font-weight:600}
.crow .ttl,.crow input.date{min-width:0}
.cols.cc{grid-template-columns:minmax(0,1fr) 120px 128px 96px 68px}
.left{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.left.over{color:var(--red-fg);font-weight:600}
.left.soon{color:var(--amber-fg);font-weight:600}
.linkbox{display:flex;flex-direction:column;gap:6px}
.linkbox select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px;font-size:13px;width:100%;text-transform:none;letter-spacing:0}
.lchips{display:flex;gap:6px;flex-wrap:wrap}
.lchip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 4px 2px 10px;font-size:12px;text-transform:none;letter-spacing:0}
.lchip button{border:0;background:transparent;color:inherit;width:18px;height:18px;border-radius:50%;padding:0;line-height:1}
.lchip button:hover{background:var(--grey-bg)}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.quick input[type=text],.quick select,.quick input[type=date]{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 10px}
.quick input[type=text]{flex:1;min-width:180px}

.mapbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.mapbar select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px}
.mapbar .grow{flex:1}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:1.5px solid var(--muted)}
.legend i.proj{background:var(--accent);border-color:var(--accent)}
.legend i.comp{background:var(--amber-bg);border-color:var(--amber-fg);border-radius:2px;transform:rotate(45deg)}
.legend i.lk{width:18px;height:0;border:0;border-top:2px dashed var(--accent);border-radius:0;vertical-align:3px}
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
svg#map{width:100%;height:min(70vh,640px);min-height:420px;display:block;touch-action:none;cursor:grab;user-select:none}
svg#map.linking{cursor:crosshair}
.edge{stroke:var(--muted);stroke-width:1;opacity:.45}
.edge.lnk{stroke:var(--accent);stroke-dasharray:5 4;stroke-width:1.8;opacity:.9}
.node{cursor:pointer}
.node .sh{stroke-width:1.5}
.n-proj{fill:var(--accent);stroke:var(--accent)}
.n-todo{fill:var(--surface);stroke:var(--muted)}
.n-prog{fill:var(--blue-bg);stroke:var(--blue-fg)}
.n-blocked{fill:var(--red-bg);stroke:var(--red-fg)}
.n-done{fill:var(--green-bg);stroke:var(--green-fg)}
.n-comp{fill:var(--amber-bg);stroke:var(--amber-fg)}
.node.sel .sh{stroke:var(--ink);stroke-width:3}
.node.dim,.edge.dim{opacity:.15}
text.lbl{fill:var(--ink);font-size:11px;font-family:var(--font-body);paint-order:stroke;stroke:var(--surface);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}
text.lbl.p{font-family:var(--font-display);font-weight:700;font-size:14px}
.mapinfo{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.mapinfo b{font-family:var(--font-display);font-size:16px}
.mapinfo .sub{color:var(--muted);font-size:12.5px}
.hint{color:var(--muted);font-size:13px}

.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cal-head h2{font-family:var(--font-display);font-size:20px;margin:0 8px 0 0;min-width:170px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);background:var(--surface);border-radius:8px;overflow:hidden}
.cal-dow{padding:6px 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--hover)}
.cal-day{min-height:96px;padding:4px 5px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal-day:hover{background:var(--hover)}
.cal-day.other{opacity:.45}
.cal-day.sel{background:var(--accent-soft)}
.cal-day .dn{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.cal-day.today .dn{color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:0 6px;align-self:flex-start;font-weight:600}
.ev{font-size:11.5px;line-height:1.25;padding:2px 5px;border-radius:4px;background:var(--grey-bg);color:var(--grey-fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev.t{background:var(--accent-soft);color:var(--accent)}
.ev.o{background:var(--red-bg);color:var(--red-fg)}
.ev.c{background:var(--amber-bg);color:var(--amber-fg)}
.ev.d{text-decoration:line-through;opacity:.6}
.ev-more{font-size:11px;color:var(--muted)}
.daypanel{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.daypanel h3{font-family:var(--font-display);font-size:16px;margin:0 0 8px}
.day-item{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);align-items:center}
.day-item:last-of-type{border-bottom:0}
.day-item span{color:var(--muted);font-size:12.5px}

@media (max-width:760px){
  .crow,.cols.cc{grid-template-columns:minmax(0,1fr) 104px 64px}
  .crow .c-cdue,.cols.cc .h-cdue,.crow .c-left,.cols.cc .h-left{display:none}
  .cal-day{min-height:58px}
  .ev{font-size:10.5px;padding:1px 3px}
  .cal-head h2{min-width:0;font-size:17px}
}
@media (prefers-reduced-motion:reduce){}


/* Discovery */
.nudge{background:var(--accent-soft);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:13px}
.dsec{margin-bottom:18px}
.dsec>h2{font-family:var(--font-display);font-size:17px;margin:0 0 4px}
.dsec>p{margin:0 0 8px;color:var(--muted);font-size:13px}
.dadd{display:flex;gap:8px;padding:8px 12px;flex-wrap:wrap}
.dadd input,.dadd select{flex:1;min-width:140px}
.dtopics{display:flex;flex-wrap:wrap;gap:8px;padding:12px}
.dtopic{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 6px 3px 12px;background:var(--surface)}
.dtopic input{border:0;background:transparent;width:130px;font-weight:600}
.dtopic select{border:0;background:var(--hover);border-radius:999px;padding:2px 6px;font-size:12px}
.dcard{display:grid;grid-template-columns:104px minmax(0,1fr) 150px 72px;gap:8px;align-items:center;padding:6px 12px;min-height:44px;border-bottom:1px solid var(--line)}
.dcard:hover{background:var(--hover)}
.dcard .ttl{font-weight:600;min-width:0}
.ddet{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;padding:12px 16px 16px;border-bottom:1px solid var(--line);background:var(--hover)}
.ddet label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.ddet textarea{min-height:130px}
.ddet .wide{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dwait{color:var(--muted);font-size:12.5px;padding:0 16px 10px;background:var(--hover)}
.igroup{padding:8px 12px 2px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--hover);border-bottom:1px solid var(--line)}
.irow{display:grid;grid-template-columns:minmax(0,1fr) 150px 120px 150px;gap:8px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line)}
.irow.dim{opacity:.5}
.irow select,.dcard select{width:100%;min-width:0}
@media (max-width:720px){.dcard,.irow{grid-template-columns:1fr 1fr}.ddet{grid-template-columns:1fr}}

/* Team, Links, Settings, moons */
.tbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}.tbar i{display:block;height:100%;background:var(--accent)}
.trun{white-space:pre-wrap;font:12.5px/1.45 var(--font-body);background:var(--hover);border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 12px;max-height:340px;overflow:auto}
.lrow{display:grid;grid-template-columns:1.2fr 1fr 1.4fr 90px;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:start}
.lrow input,.lrow select,.lrow textarea{width:100%}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:98;display:none;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto}
.setbox{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:18px;width:min(720px,100%);display:flex;flex-direction:column;gap:10px}

.chat-h{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--hover)}

.cm{max-width:88%;padding:8px 11px;border-radius:12px;white-space:pre-wrap;line-height:1.45;font-size:13.5px}

.moon{cursor:pointer}.moon-c{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.2}.moon-t{fill:var(--accent);pointer-events:none}

.cv{position:relative;height:min(74vh,760px);overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px}
.cv-surface{position:relative;width:3200px;height:2200px}.cv-svg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;color:var(--muted)}

.cv-h:active{cursor:grabbing}.cv-dots:before{content:'::::';letter-spacing:1px;opacity:.5}

@keyframes pulse{50%{opacity:.45}}

@media (max-width:900px){.wrow{grid-template-columns:1fr 1fr}}

<style>html,body{margin:0}</style></head>
<body>

<header class="mast"><div class="mast-in">
  <div class="brand"><h1>Atlas</h1><p id="today"></p></div>
  <div class="counts" id="counts"></div>
</div></header>

<main class="wrap">
  <div class="bar">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-outline" aria-selected="true" data-view="outline">Outline</button>
      <button class="tab" role="tab" id="tab-map" aria-selected="false" data-view="map">Map</button>
      <button class="tab" role="tab" id="tab-calendar" aria-selected="false" data-view="calendar">Calendar</button>
      <button class="tab" role="tab" id="tab-comps" aria-selected="false" data-view="comps">Competitions</button>
      <button class="tab" role="tab" id="tab-upcoming" aria-selected="false" data-view="upcoming">Upcoming</button>
      <button class="tab" role="tab" id="tab-disc" aria-selected="false" data-view="disc">Discovery</button>
      <button class="tab" role="tab" id="tab-canvas" aria-selected="false" data-view="canvas">Canvas</button>
      <button class="tab" role="tab" id="tab-team" aria-selected="false" data-view="team">Team</button>
      <button class="tab" role="tab" id="tab-warehouse" aria-selected="false" data-view="warehouse">Warehouse</button>
    </div>
    <div class="tools" id="gc"><button class="btn" id="pause-btn" aria-pressed="false" title="Master switch: pauses every agent at once">Agents: live</button><button class="btn" id="bell-btn">Alerts</button><button class="btn" id="set-btn">Settings</button><button class="btn" id="focus-btn" aria-pressed="false" title="Hide Discovery and stay on the main work">Focus: off</button><span class="hint" id="gc-msg"></span><button class="btn" id="gc-now" hidden>Sync now</button><button class="btn" id="gc-btn" aria-pressed="false">Google Calendar: off</button></div>
    <div class="tools" id="tools">
      <input class="search" id="q" type="search" placeholder="Search tasks" aria-label="Search tasks">
      <div class="chips">
        <button class="chip-b" id="f-all" aria-pressed="true" data-flt="all">All</button>
        <button class="chip-b" id="f-active" aria-pressed="false" data-flt="active">Open</button>
        <button class="chip-b" id="f-over" aria-pressed="false" data-flt="overdue">Overdue</button>
        <button class="chip-b" id="f-hide" aria-pressed="false" data-hide="1">Hide done</button>
      </div>
    </div>
  </div>
  <div id="view"></div>
</main>
<div class="toast" id="toast" hidden></div>
<div class="npanel" id="notes-panel"></div>

<script>
(function(){
  var STATUS=['Backlog','To do','In progress','Blocked','Done'];
  var PRIO=['High','Medium','Low'];
  var OWNERS=['Me','Teammate','Collaborator','Other'];
  var CSTAT=['Idea','Preparing','Submitted','Won','Missed'];
  var CCLS={Idea:'s-todo',Preparing:'s-inprogress',Submitted:'p-medium',Won:'s-done',Missed:'s-blocked'};
  var now0=new Date();
  var S={items:{},kids:{},comps:{},view:'outline',open:null,copen:null,q:'',flt:'all',hideDone:false,collapsed:{},ready:false,delArm:null,focusNew:null,
         calY:now0.getFullYear(),calM:now0.getMonth(),sync:false,syncState:'',syncMsg:'',selDay:null,calParent:'',mapProj:'',mapSub:true,mapSel:null,linkFrom:null,disc:{},dopen:null,focus:false,map3d:true};
  var db=null,pendingRender=false,chains={},toastT=null;
  var M={pos:{},view:{x:-450,y:-300,w:900,h:600},drag:null};
  var $=function(s){return document.querySelector(s)};

  try{var sv=JSON.parse(localStorage.getItem('atlas-ui')||'{}');if(sv.sync)S.sync=true;
    if(sv.collapsed)S.collapsed=sv.collapsed; if(sv.view)S.view=sv.view; if(sv.hideDone)S.hideDone=true;if(sv.focus)S.focus=true;if(sv.map3d===false)S.map3d=false;}catch(e){}
  function persist(){try{localStorage.setItem('atlas-ui',JSON.stringify({collapsed:S.collapsed,view:S.view,hideDone:S.hideDone,sync:S.sync,focus:S.focus,map3d:S.map3d}))}catch(e){}}

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function pad(n){return (n<10?'0':'')+n}
  function fmt(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
  function today(){return fmt(new Date())}
  function addDays(s,n){var d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return fmt(d)}
  function slug(s){return String(s||'').toLowerCase().replace(/[^a-z]/g,'')}
  function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},3500)}
  function isUrl(u){return /^https?:\/\//i.test(u||'')}
  function dateLabel(s){var d=new Date(s+'T00:00:00');return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}
  function daysLeft(s){return Math.round((new Date(s+'T00:00:00')-new Date(today()+'T00:00:00'))/86400000)}

  var I={
    chev:'<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg>',
    plus:'<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M7 2.5v9M2.5 7h9"/></svg>',
    dots:'<svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><circle cx="3" cy="7" r="1.2"/><circle cx="7" cy="7" r="1.2"/><circle cx="11" cy="7" r="1.2"/></svg>'
  };

  /* ---------- data ---------- */
  function rebuild(docs){
    var items={},kids={};
    docs.forEach(function(d){var v=d.data();items[d.id]=Object.assign({id:d.id},v)});
    Object.keys(items).forEach(function(id){var p=items[id].parent||'';if(p&&!items[p])items[id].parent='';(kids[items[id].parent||'']=kids[items[id].parent||'']||[]).push(items[id])});
    Object.keys(kids).forEach(function(k){kids[k].sort(function(a,b){return (a.order||0)-(b.order||0)})});
    S.items=items;S.kids=kids;
  }
  function rebuildComps(docs){var c={};docs.forEach(function(d){c[d.id]=Object.assign({id:d.id,isComp:true},d.data())});S.comps=c}
  function reload(){rebuild(Object.keys(S.items).map(function(k){return {id:k,data:function(){return S.items[k]}}}));render()}
  function kidsOf(id){return S.kids[id||'']||[]}
  function node(id){return S.items[id]||S.comps[id]}
  function allNodes(){return Object.keys(S.items).map(function(k){return S.items[k]}).concat(Object.keys(S.comps).map(function(k){return S.comps[k]}))}
  function rootOf(n){while(n.parent&&S.items[n.parent])n=S.items[n.parent];return n}
  function leaves(n,out){out=out||[];var k=kidsOf(n.id);if(!k.length)out.push(n);else k.forEach(function(c){leaves(c,out)});return out}
  function progress(n){if(!kidsOf(n.id).length)return null;var l=leaves(n),d=l.filter(function(x){return x.done}).length;return {d:d,t:l.length,pct:Math.round(100*d/l.length)}}
  function depthOf(n){var d=0;while(n.parent&&S.items[n.parent]){n=S.items[n.parent];d++}return d}
  function isOverdue(n){return !!n.due&&!n.done&&n.due<today()}
  function descendants(n,out){out=out||[];kidsOf(n.id).forEach(function(c){out.push(c);descendants(c,out)});return out}
  function maxOrder(pid){var k=kidsOf(pid);return k.length?k[k.length-1].order:0}
  function pathOf(n){var p=[];while(n.parent&&S.items[n.parent]){n=S.items[n.parent];p.unshift(n.title)}return p}
  function title(n){return n.isComp?(n.name||'Untitled competition'):(n.title||'Untitled')}

  function write(id,patch){
    var col=S.comps[id]?'comps':'items';
    var p=(chains[id]||Promise.resolve()).then(function(){return db.doc(col+'/'+id).update(patch)})
      .catch(function(e){toast('Could not save'+(e&&e.code==='invalid_argument'?': you have view-only access':''))});
    chains[id]=p;return p;
  }
  var SYNCKEYS=['onCal','due','deadline','title','name','done','status','notes','link','url','priority','parent'];
  function setFields(id,patch){
    var n=node(id);if(!n)return Promise.resolve();Object.assign(n,patch);
    var p=write(id,patch);
    if(S.sync&&SYNCKEYS.some(function(k){return k in patch}))scheduleSync(id);
    return p;
  }
  function stamped(n,p){
    var o=Object.assign({},p),nowS=today();
    if('done' in p){
      if(p.done){o.status='Done';if(!n.finished)o.finished=nowS}
      else{if(n.status==='Done')o.status='To do';o.finished=''}
    }else if('status' in p){
      if(p.status==='Done'){o.done=true;if(!n.finished)o.finished=nowS}
      else{if(n.done){o.done=false;o.finished=''}if(p.status==='In progress'&&!n.started)o.started=nowS}
    }
    return o;
  }
  function syncParent(n){
    var p=n.parent&&S.items[n.parent];if(!p||!p.parent)return;
    var all=kidsOf(p.id).every(function(k){return k.done});
    if(all&&!p.done)setFields(p.id,stamped(p,{done:true})).then(function(){syncParent(p)});
    else if(!all&&p.done)setFields(p.id,stamped(p,{done:false})).then(function(){syncParent(p)});
  }
  function changeItem(id,p){
    var n=S.items[id];if(!n)return;
    var patch=stamped(n,p);
    var chain=setFields(id,patch);
    if('done' in patch&&patch.done&&kidsOf(id).length){descendants(n).forEach(function(c){if(!c.done)setFields(c.id,stamped(c,{done:true}))})}
    chain.then(function(){syncParent(n);render()});
    render();
  }
  function newId(pre){return pre+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
  function addItem(pid,ttl,due){
    var id=newId('i'),isProj=!pid;
    var doc={title:ttl||'',parent:pid||'',order:maxOrder(pid||'')+1,done:false,status:isProj?'':'To do',priority:'',owner:isProj?'':'Me',due:due||'',notes:'',link:'',links:[],added:today(),started:'',finished:''};
    S.items[id]=Object.assign({id:id},doc);(S.kids[pid||'']=S.kids[pid||'']||[]).push(S.items[id]);
    if(pid){S.collapsed[pid]=false;persist()}
    if(!ttl)S.focusNew=id;
    render();
    db.doc('items/'+id).set(doc).then(function(){if(S.sync&&doc.due)scheduleSync(id)}).catch(function(){toast('Could not add item')});
    return id;
  }
  function addComp(name,due){
    var id=newId('c');
    var doc={name:name||'',deadline:due||'',status:'Idea',url:'',fee:'',prize:'',notes:'',links:[],added:today()};
    S.comps[id]=Object.assign({id:id,isComp:true},doc);
    S.copen=id;S.focusNew='c:'+id;render();
    db.doc('comps/'+id).set(doc).then(function(){if(S.sync&&doc.deadline)scheduleSync(id)}).catch(function(){toast('Could not add competition')});
  }
  function swap(a,b){var oa=a.order,ob=b.order;return Promise.all([setFields(a.id,{order:ob}),setFields(b.id,{order:oa})])}
  function move(id,dir){
    var n=S.items[id],sib=kidsOf(n.parent),i=sib.indexOf(n),o=sib[i+dir];
    if(!o){toast(dir<0?'Already first':'Already last');return}
    swap(n,o).then(reload);
  }
  function indent(id){
    var n=S.items[id],sib=kidsOf(n.parent),i=sib.indexOf(n),p=sib[i-1];
    if(!p){toast('Nothing above to nest under');return}
    S.collapsed[p.id]=false;persist();
    setFields(id,{parent:p.id,order:maxOrder(p.id)+1});reload();
  }
  function outdent(id){
    var n=S.items[id],q=S.items[n.parent];
    if(!q){toast('Already top level');return}
    var sib=kidsOf(q.parent),i=sib.indexOf(q),nx=sib[i+1];
    setFields(id,{parent:q.parent||'',order:nx?(q.order+nx.order)/2:q.order+1});reload();
  }
  function removeItem(id){
    var n=S.items[id],all=[n].concat(descendants(n));
    all.forEach(function(x){if(x.gcalId)gcDelete(x)});
    all.forEach(function(x){delete S.items[x.id]});S.open=null;reload();
    all.reduce(function(p,x){return p.then(function(){return db.doc('items/'+x.id).delete()})},Promise.resolve())
      .catch(function(){toast('Could not delete everything')});
  }
  function removeComp(id){if(S.comps[id]&&S.comps[id].gcalId)gcDelete(S.comps[id]);delete S.comps[id];S.copen=null;render();db.doc('comps/'+id).delete().catch(function(){toast('Could not delete')})}

  /* ---------- links between nodes (the mind map) ---------- */
  function linkedIds(id){
    var n=node(id),set={};if(!n)return [];
    (n.links||[]).forEach(function(x){if(node(x))set[x]=1});
    allNodes().forEach(function(m){if((m.links||[]).indexOf(id)>-1)set[m.id]=1});
    return Object.keys(set);
  }
  function toggleLink(a,b){
    if(a===b)return;
    var A=node(a),B=node(b);if(!A||!B)return;
    var la=(A.links||[]).slice(),lb=(B.links||[]).slice(),i;
    if((i=la.indexOf(b))>-1){la.splice(i,1);setFields(a,{links:la})}
    else if((i=lb.indexOf(a))>-1){lb.splice(i,1);setFields(b,{links:lb})}
    else{la.push(b);setFields(a,{links:la})}
  }
  function linkOptions(exclude){
    var out=[];
    (function walk(pid,d){kidsOf(pid).forEach(function(n){if(n.id!==exclude)out.push([n.id,new Array(d+1).join('  ')+(n.title||'Untitled')]);walk(n.id,d+1)})})('',0);
    Object.keys(S.comps).forEach(function(k){if(k!==exclude)out.push([k,'Competition: '+title(S.comps[k])])});
    return out;
  }
  function linkBox(n){
    var ids=linkedIds(n.id);
    var h='<label>Linked to<span class="linkbox"><select data-act="addlink" aria-label="Link to another item"><option value="">Link to another step or competition</option>'+
      linkOptions(n.id).map(function(o){return '<option value="'+o[0]+'">'+esc(o[1])+'</option>'}).join('')+'</select>';
    if(ids.length)h+='<span class="lchips">'+ids.map(function(x){var m=node(x);return '<span class="lchip">'+esc(title(m))+'<button data-act="rmlink" data-to="'+x+'" aria-label="Remove link">×</button></span>'}).join('')+'</span>';
    return h+'</span></label>';
  }

  /* ---------- filters ---------- */
  function selfMatch(n){
    if(S.q&&n.title.toLowerCase().indexOf(S.q)<0)return false;
    if(S.flt==='active'&&n.done)return false;
    if(S.flt==='overdue'&&!isOverdue(n))return false;
    if(S.hideDone&&n.done)return false;
    return true;
  }
  function shows(n){return selfMatch(n)||kidsOf(n.id).some(shows)}
  function collapsed(n){return !S.q&&S.flt==='all'&&!S.hideDone?!!S.collapsed[n.id]:false}

  /* ---------- calendar links / exports ---------- */
  function gcalUrl(text,date,details){
    return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(text)+
      '&dates='+date.replace(/-/g,'')+'/'+addDays(date,1).replace(/-/g,'')+'&details='+encodeURIComponent(details||'');
  }
  function gcal(n){
    if(n.isComp)return gcalUrl('Competition deadline: '+title(n),n.deadline,(n.notes||'')+(isUrl(n.url)?'\n'+n.url:''));
    var r=rootOf(n);
    return gcalUrl('['+r.title+'] '+n.title,n.due,(n.notes||'')+(isUrl(n.link)?'\n'+n.link:''));
  }
  function csvCell(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
  function saveFile(filename,data,okMsg){
    var o=document.createElement('div');
    o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:99;display:flex;align-items:center;justify-content:center;padding:16px';
    o.innerHTML='<div style="background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:16px;width:min(720px,100%);max-height:90vh;display:flex;flex-direction:column;gap:10px"><b>'+esc(filename)+'</b><textarea readonly style="flex:1;min-height:280px;font:12px/1.4 var(--font-mono,monospace);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px"></textarea><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn primary" data-a="copy">Copy</button><button class="btn" data-a="dl">Download</button><button class="btn" data-a="x">Close</button></div></div>';
    document.body.appendChild(o);
    var ta=o.querySelector('textarea');ta.value=data;
    o.addEventListener('click',function(e){
      var a=e.target.getAttribute&&e.target.getAttribute('data-a');
      if(a==='x'||e.target===o){o.remove();return}
      if(a==='copy'){ta.select();try{document.execCommand('copy');toast('Copied. '+okMsg)}catch(x){toast('Select all and copy')}}
      if(a==='dl'){try{var u=URL.createObjectURL(new Blob([data],{type:'text/plain'})),l=document.createElement('a');l.href=u;l.download=filename;document.body.appendChild(l);l.click();l.remove()}catch(x){toast('Download blocked here. Use Copy.')}}
    });
  }
  function events(){
    var out=[];
    allNodes().forEach(function(n){

  function mapEdges(vis){
    var e=[];

      if(!n.isComp&&n.parent&&vis[n.parent])e.push({a:n.parent,b:id,t:'h'});

  function nodeR(n){if(n.isComp)return 9;var d=depthOf(n);return d===0?17:d===1?10:6}
  function sim(ids,edges,iters,fixed){
    var P=M.pos,V={};
    ids.forEach(function(id){V[id]={x:0,y:0}});
    for(var it=0;it<iters;it++){
      var cool=1-it/iters*.7;
      for(var i=0;i<ids.length;i++){
        var a=ids[i],pa=P[a];
        for(var j=i+1;j<ids.length;j++){
          var b=ids[j],pb=P[b],dx=pa.x-pb.x,dy=pa.y-pb.y,d2=dx*dx+dy*dy+30;
          if(d2>160000)continue;
          var f=2600/d2,d=Math.sqrt(d2);dx=dx/d*f;dy=dy/d*f;
          V[a].x+=dx;V[a].y+=dy;V[b].x-=dx;V[b].y-=dy;
        }
      }
      edges.forEach(function(e){
        var pa=P[e.a],pb=P[e.b],dx=pb.x-pa.x,dy=pb.y-pa.y,d=Math.sqrt(dx*dx+dy*dy)+.01;
        var na=node(e.a),len=e.t==='l'?190:(na&&!na.isComp&&depthOf(na)===0?105:70),k=e.t==='l'?.012:.05;
        var f=(d-len)*k,fx=dx/d*f,fy=dy/d*f;
        V[e.a].x+=fx;V[e.a].y+=fy;V[e.b].x-=fx;V[e.b].y-=fy;
      });
      ids.forEach(function(id){
        if(fixed&&fixed[id])return;
        var p=P[id],v=V[id];v.x-=p.x*.004;v.y-=p.y*.004;
        p.x+=Math.max(-18,Math.min(18,v.x*cool*.8));p.y+=Math.max(-18,Math.min(18,v.y*cool*.8));
      });
    }
  }
  function mapLayout(){
    var vis=mapVisible(),ids=Object.keys(vis),edges=mapEdges(vis);
    var fresh=ids.filter(function(id){return !M.pos[id]});
    if(!fresh.length)return {vis:vis,ids:ids,edges:edges};
    var heads=ids.filter(function(id){var n=node(id);return n.isComp||!n.parent||!vis[n.parent]});
    var ring=0;
    fresh.sort(function(a,b){return (node(a).isComp?0:depthOf(node(a)))-(node(b).isComp?0:depthOf(node(b)))}).forEach(function(id){
      var n=node(id),par=!n.isComp&&n.parent&&M.pos[n.parent];
      if(par)M.pos[id]={x:par.x+(Math.random()-.5)*70,y:par.y+(Math.random()-.5)*70};
      else{var ang=(heads.indexOf(id)/Math.max(heads.length,1))*Math.PI*2;M.pos[id]={x:Math.cos(ang)*230+(Math.random()-.5)*20,y:Math.sin(ang)*230+(Math.random()-.5)*20}}
    });
    var fixed=null;
    if(fresh.length<ids.length*.5){fixed={};ids.forEach(function(id){if(fresh.indexOf(id)<0)fixed[id]=1})}
    sim(ids,edges,fresh.length===ids.length?320:160,fixed);
    return {vis:vis,ids:ids,edges:edges};
  }

  /* ---------- 3D map ---------- */
  var M3={pos:{},yaw:.7,pitch:.35,zoom:1,spin:true,hoverT:0,skip:0,t:0};
  function sim3(ids,edges,iters,fixed){
    var P=M3.pos,V={};
    ids.forEach(function(id){V[id]={x:0,y:0,z:0}});
    for(var it=0;it<iters;it++){
      var cool=1-it/iters*.7;
      for(var i=0;i<ids.length;i++){
        var a=ids[i],pa=P[a];
        for(var j=i+1;j<ids.length;j++){
          var b=ids[j],pb=P[b],dx=pa.x-pb.x,dy=pa.y-pb.y,dz=pa.z-pb.z,d2=dx*dx+dy*dy+dz*dz+30;
          if(d2>250000)continue;
          var d=Math.sqrt(d2),f=3200/d2;dx=dx/d*f;dy=dy/d*f;dz=dz/d*f;
          V[a].x+=dx;V[a].y+=dy;V[a].z+=dz;V[b].x-=dx;V[b].y-=dy;V[b].z-=dz;
        }
      }
      edges.forEach(function(e){
        var pa=P[e.a],pb=P[e.b],dx=pb.x-pa.x,dy=pb.y-pa.y,dz=pb.z-pa.z,d=Math.sqrt(dx*dx+dy*dy+dz*dz)+.01;
        var na=node(e.a),len=e.t==='l'?200:(na&&!na.isComp&&depthOf(na)===0?115:78),k=e.t==='l'?.012:.05;
        var f=(d-len)*k,fx=dx/d*f,fy=dy/d*f,fz=dz/d*f;
        V[e.a].x+=fx;V[e.a].y+=fy;V[e.a].z+=fz;V[e.b].x-=fx;V[e.b].y-=fy;V[e.b].z-=fz;
      });
      ids.forEach(function(id){
        if(fixed&&fixed[id])return;
        var p=P[id],v=V[id],c=function(x){return Math.max(-18,Math.min(18,x*cool*.8))};
        v.x-=p.x*.004;v.y-=p.y*.004;v.z-=p.z*.004;
        p.x+=c(v.x);p.y+=c(v.y);p.z+=c(v.z);
      });
    }
  }
  function mapLayout3(){
    var vis=mapVisible(),ids=Object.keys(vis),edges=mapEdges(vis),P=M3.pos;
    var fresh=ids.filter(function(id){return !P[id]});
    if(fresh.length){
      var rnd=function(r){return (Math.random()-.5)*r};
      fresh.sort(function(a,b){return (node(a).isComp?0:depthOf(node(a)))-(node(b).isComp?0:depthOf(node(b)))}).forEach(function(id){
        var n=node(id),par=!n.isComp&&n.parent&&P[n.parent];
        if(par)P[id]={x:par.x+rnd(80),y:par.y+rnd(80),z:par.z+rnd(80)};
        else{var u=Math.random()*Math.PI*2,v=Math.acos(2*Math.random()-1);P[id]={x:Math.sin(v)*Math.cos(u)*230,y:Math.sin(v)*Math.sin(u)*230,z:Math.cos(v)*230}}
      });
      var fixed=null;
      if(fresh.length<ids.length*.5){fixed={};ids.forEach(function(id){if(fresh.indexOf(id)<0)fixed[id]=1})}
      sim3(ids,edges,fresh.length===ids.length?300:140,fixed);
    }
    return {vis:vis,ids:ids,edges:edges};
  }
  function proj3(p){
    var cy=Math.cos(M3.yaw),sy=Math.sin(M3.yaw),cp=Math.cos(M3.pitch),sp=Math.sin(M3.pitch);
    var x1=p.x*cy+p.z*sy,z1=-p.x*sy+p.z*cy,y2=p.y*cp-z1*sp,z2=p.y*sp+z1*cp;
    var D=900,s=D/(D+z2);
    return {x:x1*s*M3.zoom,y:y2*s*M3.zoom,s:s*M3.zoom,z:z2,k:Math.max(0,Math.min(1,(z2+400)/800))};
  }
  function graph3(L){
    var sel=S.mapSel,nb={};
    if(sel&&node(sel)){nb[sel]=1;linkedIds(sel).forEach(function(x){nb[x]=1});var sn=node(sel);if(!sn.isComp&&sn.parent)nb[sn.parent]=1;kidsOf(sel).forEach(function(k){nb[k.id]=1})}
    else sel=null;
    var Q={};L.ids.forEach(function(id){if(M3.pos[id])Q[id]=proj3(M3.pos[id])});
    var h='',H=[];
    L.edges.slice().filter(function(e){return Q[e.a]&&Q[e.b]}).sort(function(a,b){return (Q[b.a].z+Q[b.b].z)-(Q[a.a].z+Q[a.b].z)}).forEach(function(e){
      var a=Q[e.a],b=Q[e.b],dim=sel&&!(nb[e.a]&&nb[e.b]&&(e.a===sel||e.b===sel)),o=.15+.55*(1-(a.k+b.k)/2);
      h+='<line class="edge'+(e.t==='l'?' lnk':'')+(dim?' dim':'')+'" style="opacity:'+(dim?.1:o.toFixed(2))+'" x1="'+a.x.toFixed(1)+'" y1="'+a.y.toFixed(1)+'" x2="'+b.x.toFixed(1)+'" y2="'+b.y.toFixed(1)+'"/>';
    });
    L.ids.filter(function(id){return Q[id]}).forEach(function(id){
      var n=node(id),q=Q[id],r=nodeR(n)*q.s,isP=!n.isComp&&depthOf(n)===0,deep=!n.isComp&&depthOf(n)>=2;
      var dim=sel&&!nb[id],o=dim?.12:(.45+.55*(1-q.k)),cls='node '+(id===sel?'sel ':'')+(dim?'dim ':'')+(S.linkFrom===id?'sel ':'');
      var g='<g class="'+cls+'" data-node="'+id+'" style="opacity:'+o.toFixed(2)+'" transform="translate('+q.x.toFixed(1)+','+q.y.toFixed(1)+')">';
      if(n.isComp)g+='<rect class="sh '+nodeClass(n)+'" x="'+(-r).toFixed(1)+'" y="'+(-r).toFixed(1)+'" width="'+(2*r).toFixed(1)+'" height="'+(2*r).toFixed(1)+'" transform="rotate(45)"/>';
      else g+='<circle class="sh '+nodeClass(n)+'" r="'+r.toFixed(1)+'"/>';
      if(!deep||id===sel||nb[id]||q.s>1.05){var fs=Math.max(7,Math.min(15,(isP?13:11)*q.s));
        g+='<text class="lbl'+(isP?' p':'')+'" style="font-size:'+fs.toFixed(1)+'px" x="'+(r+4).toFixed(1)+'" y="4">'+esc(title(n).length>34?title(n).slice(0,33)+'…':title(n))+'</text>'}
      H.push({z:q.z,h:g+'</g>'});
      var dl=dirFor(id);
      dl.forEach(function(d,i){
        var p0=M3.pos[id],ang=M3.t+i*6.2832/dl.length,R=nodeR(n)+13;
        var mp=proj3({x:p0.x+Math.cos(ang)*R,y:p0.y+Math.sin(ang*.7)*R*.4,z:p0.z+Math.sin(ang)*R}),mr=Math.max(2.8,4.2*mp.s);
        H.push({z:mp.z,h:'<g class="moon" data-moon="'+esc(d.url)+'" style="opacity:'+(dim?.12:.95)+'" transform="translate('+mp.x.toFixed(1)+','+mp.y.toFixed(1)+')"><title>'+esc((d.title||d.url)+(d.account?' · '+d.account:'')+(d.about?'\n'+d.about:''))+'</title><circle r="'+mr.toFixed(1)+'" class="moon-c"/><text class="moon-t" style="font-size:'+(mr*1.3).toFixed(1)+'px" text-anchor="middle" y="'+(mr*.45).toFixed(1)+'">&#8599;</text></g>'});
      });
    });
    H.sort(function(a,b){return b.z-a.z});
    return h+H.map(function(x){return x.h}).join('');
  }

  function cvEdge(r,tx,ty){

    var s=Math.min(dx?(r.w/2)/Math.abs(dx):1e9,dy?(r.h/2)/Math.abs(dy):1e9);
    return{x:cx+dx*s,y:cy+dy*s};

  function teamChange(t,act,k,id){
    if(act==='agprov'){var d=(PROV[t.value]||{}).model||'';agWrite(id,{provider:t.value,model:d});render();return true}
    if(act==='aglife'){agWrite(id,{life:t.value});render();return true}
    if(act==='aguntil'){agWrite(id,{until:t.value});return true}
    if(act==='agmode'){agWrite(id,{mode:t.value});return true}
    if(act==='agweb'){agWrite(id,{web:t.checked});return true}
    if(act==='agadmin'){if(t.checked){t.checked=false;S.adminArm=id;render()}else{agWrite(id,{admin:false});render()}return true}
    if(act==='ltag'){dirWrite(id,{tag:t.value});render();return true}
    if(k){
      var f=k.split(':')[0],ag={agname:'name',agbrief:'brief',agmodel:'model',agsheet:'sheetUrl'},nm={agbd:'budgetDay',agbw:'budgetWeek'},ln={ltitle:'title',lurl:'url',lacct:'account',labout:'about'},o={};
      if(ag[f]){o[ag[f]]=f==='agbrief'?t.value:t.value.trim();agWrite(id,o);t.defaultValue=t.value;render();return true}
      if(nm[f]){o[nm[f]]=Math.max(0,+t.value||0);agWrite(id,o);t.defaultValue=t.value;return true}
      if(ln[f]){o[ln[f]]=f==='labout'?t.value:t.value.trim();dirWrite(id,o);t.defaultValue=t.value;render();return true}
    }
    return false;
  }
  $('#pause-btn').addEventListener('click',function(){saveCfg({pause:!cfgd().pause});toast(cfgd().pause?'All agents paused':'Agents live')});
  $('#set-btn').addEventListener('click',openSettings);
  $('#bell-btn').addEventListener('click',function(e){e.stopPropagation();S.notesOpen=!S.notesOpen;chrome()});
  $('#notes-panel').addEventListener('click',function(e){
    e.stopPropagation();
    if(e.target.closest('[data-na="readall"]')){Object.keys(S.notes).forEach(function(k){if(!S.notes[k].read){S.notes[k].read=true;db.doc('notes/'+k).update({read:true}).catch(function(){})}});chrome();return}
    var r=e.target.closest('.nrow');if(!r)return;
    var nid=r.dataset.nid;if(S.notes[nid]&&!S.notes[nid].read){S.notes[nid].read=true;db.doc('notes/'+nid).update({read:true}).catch(function(){})}
    if(S.agents[r.dataset.ag]){S.teamOpen=r.dataset.ag;S.view='team';persist()}
    S.notesOpen=false;render();
  });
  document.addEventListener('click',function(e){if(S.notesOpen&&!e.target.closest('#notes-panel,#bell-btn')){S.notesOpen=false;chrome()}});

  /* ---------- events ---------- */
  var view=$('#view');
  function idOf(el){var r=el.closest('[data-id]');return r&&r.dataset.id}
  function gotoView(v){S.view=v;persist();render()}
  view.addEventListener('click',function(e){
    var day=e.target.closest('[data-day]');
    if(day&&!e.target.closest('a')){S.selDay=day.dataset.day;render();return}
    var b=e.target.closest('[data-act]');if(!b)return;
    var act=b.dataset.act,id=idOf(b);
    if(discClick(act,b,id)||teamClick(act,b,id)||whClick(act,b,id)||cvClick(act,b,id))return;
    if(act==='toggle'){if(kidsOf(id).length){S.collapsed[id]=!S.collapsed[id];persist();render()}}
    else if(act==='add'){addItem(id)}
    else if(act==='addto'){addItem(b.dataset.pid)}
    else if(act==='addproj'){addItem('')}
    else if(act==='detail'){S.open=S.open===id?null:id;S.delArm=null;render()}
    else if(act==='up'){move(id,-1)}
    else if(act==='down'){move(id,1)}
    else if(act==='indent'){indent(id)}
    else if(act==='outdent'){outdent(id)}
    else if(act==='del'){if(S.delArm===id)removeItem(id);else{S.delArm=id;render()}}
    else if(act==='csv'){exportCsv()}
    else if(act==='cdetail'){S.copen=S.copen===id?null:id;S.delArm=null;render()}
    else if(act==='concal'){setFields(id,{onCal:S.comps[id].onCal===false});render()}
    else if(act==='cdel'){if(S.delArm===id)removeComp(id);else{S.delArm=id;render()}}
    else if(act==='addcomp'){addComp('','')}
    else if(act==='rmlink'){toggleLink(id,b.dataset.to);render()}
    else if(act==='showmap'){S.mapSel=id;S.mapProj='';S.view='map';persist();render()}
    else if(act==='calprev'){if(--S.calM<0){S.calM=11;S.calY--}render()}
    else if(act==='calnext'){if(++S.calM>11){S.calM=0;S.calY++}render()}
    else if(act==='caltoday'){var n0=new Date();S.calY=n0.getFullYear();S.calM=n0.getMonth();S.selDay=today();render()}
    else if(act==='caladd'){
      var ti=$('#cal-title'),par=$('#cal-parent').value,txt=ti.value.trim();
      if(!txt){toast('Type a title first');ti.focus();return}
      S.calParent=par;ti.defaultValue=ti.value='';
      if(par==='__comp')addComp(txt,S.selDay);else addItem(par,txt,S.selDay);
      toast('Added to '+dateLabel(S.selDay));
    }
    else if(act==='mapsub'){S.mapSub=!S.mapSub;render()}
    else if(act==='maplink'){S.linkFrom=S.linkFrom?null:(S.mapSel||'pick');if(S.linkFrom==='pick')S.linkFrom='pick';render()}
    else if(act==='maprelayout'){M.pos={};M3.pos={};render()}
    else if(act==='map3d'){S.map3d=!S.map3d;persist();render()}
    else if(act==='map3dspin'){M3.spin=!M3.spin;render()}
    else if(act==='mapstart'){S.linkFrom=S.mapSel;render()}
    else if(act==='mapopen'){var nn=node(S.mapSel);if(nn){if(nn.isComp){S.copen=nn.id;S.view='comps'}else{S.open=nn.id;S.view='outline';var p=nn;while(p.parent&&S.items[p.parent]){p=S.items[p.parent];S.collapsed[p.id]=false}}persist();render()}}
    else if(act==='planmd'){saveFile('plan.md',planMd(),'plan.md saved. Drop it into an Obsidian vault.')}
  });
  view.addEventListener('change',function(e){
    var t=e.target,act=t.dataset.act,k=t.dataset.k,id=idOf(t);
    if(discChange(t,act,k,id)||whChange(t,act,k,id)||cvChange(t,act,k,id)||teamChange(t,act,k,id))return;
    if(act==='done')changeItem(id,{done:t.checked});
    else if(act==='status')changeItem(id,{status:t.value});
    else if(act==='priority'){setFields(id,{priority:t.value});render()}
    else if(act==='owner'){ownerChange(id,t.value)}
    else if(act==='due'){setFields(id,{due:t.value});render()}
    else if(act==='cstatus'){setFields(id,{status:t.value});render()}
    else if(act==='cdue'){setFields(id,{deadline:t.value});render()}
    else if(act==='addlink'){if(t.value){toggleLink(id,t.value);render()}}
    else if(act==='mapproj'){S.mapProj=t.value;render()}
    else if(t.id==='cal-parent'){S.calParent=t.value}
    else if(k){
      var f=k.split(':')[0];
      if(f==='ttl')setFields(id,{title:t.value.trim()});
      else if(f==='notes')setFields(id,{notes:t.value});
      else if(f==='link')setFields(id,{link:t.value.trim()});
      else if(f==='cname')setFields(id,{name:t.value.trim()});
      else if(f==='cnotes')setFields(id,{notes:t.value});
      else if(f==='curl')setFields(id,{url:t.value.trim()});
      else if(f==='cfee')setFields(id,{fee:t.value.trim()});
      else if(f==='cprize')setFields(id,{prize:t.value.trim()});
      if(f!=='caltitle'){t.defaultValue=t.value;render()}
    }
  });
  view.addEventListener('focusout',function(){setTimeout(function(){if(pendingRender){var a=document.activeElement;if(!(a&&a.dataset&&a.dataset.k&&a.value!==a.defaultValue)){pendingRender=false;render()}}},0)});
  view.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&e.target.classList.contains('ttl'))e.target.blur();
    if(e.key==='Enter'&&e.target.dataset.enter){var eb=document.querySelector('[data-act="'+e.target.dataset.enter+'"]');if(eb)eb.click()}
    if(e.key==='Enter'&&e.target.id==='cal-title'){var b=$('[data-act="caladd"]');if(b)b.click()}
    if(e.key==='Escape'&&e.target.dataset.k){e.target.value=e.target.defaultValue;e.target.blur()}});
  document.addEventListener('click',function(e){
    var t=e.target.closest('[data-view],[data-flt],[data-hide]');
    if(!t)return;
    if(t.dataset.view){S.view=t.dataset.view;persist();render()}
    else if(t.dataset.flt){S.flt=t.dataset.flt;render()}
    else if(t.dataset.hide){S.hideDone=!S.hideDone;persist();render()}
  });
  $('#q').addEventListener('input',function(e){S.q=e.target.value.trim().toLowerCase();render()});

  /* ---------- map pointer handling ---------- */
  function svgPoint(svg,cx,cy){var pt=svg.createSVGPoint();pt.x=cx;pt.y=cy;var m=svg.getScreenCTM();return m?pt.matrixTransform(m.inverse()):{x:cx,y:cy}}
  view.addEventListener('pointerdown',function(e){
    var svg=e.target.closest('svg#map');if(!svg)return;
    var g=e.target.closest('[data-node]');
    M.drag={id:g?g.dataset.node:null,sx:e.clientX,sy:e.clientY,moved:false,vx:M.view.x,vy:M.view.y,svg:svg,pid:e.pointerId,moon:(function(){var m=e.target.closest('[data-moon]');return m?m.getAttribute('data-moon'):''})()};
    try{svg.setPointerCapture(e.pointerId)}catch(x){}
  });
  view.addEventListener('pointermove',function(e){
    if(e.target.closest&&e.target.closest('svg#map'))M3.hoverT=Date.now();
    var d=M.drag;if(!d)return;
    var dx=e.clientX-d.sx,dy=e.clientY-d.sy;
    if(!d.moved&&Math.abs(dx)+Math.abs(dy)<5)return;
    d.moved=true;
    if(S.map3d){M3.yaw+=(e.clientX-(d.lx==null?d.sx:d.lx))*.008;M3.pitch=Math.max(-1.45,Math.min(1.45,M3.pitch+(e.clientY-(d.ly==null?d.sy:d.ly))*.008));d.lx=e.clientX;d.ly=e.clientY;M3.hoverT=Date.now();drawMap();return}
    if(d.id){var p=svgPoint(d.svg,e.clientX,e.clientY);M.pos[d.id]={x:p.x,y:p.y};drawMap()}
    else{var r=d.svg.getBoundingClientRect(),sc=M.view.w/r.width;M.view.x=d.vx-dx*sc;M.view.y=d.vy-dy*sc;applyView()}
  });
  function endDrag(e){
    var d=M.drag;if(!d)return;M.drag=null;
    if(!d.moved&&d.moon){window.open(d.moon,'_blank','noopener');return}
    if(!d.moved&&d.id){
      if(S.linkFrom&&S.linkFrom!=='pick'){toggleLink(S.linkFrom,d.id);toast('Link updated');S.linkFrom=null;S.mapSel=d.id}
      else if(S.linkFrom==='pick'){S.linkFrom=d.id;S.mapSel=d.id}
      else S.mapSel=S.mapSel===d.id?null:d.id;
      render();
    }else if(!d.moved&&!d.id){S.mapSel=null;render()}
  }
  view.addEventListener('pointerup',endDrag);
  view.addEventListener('pointercancel',function(){M.drag=null});
  view.addEventListener('wheel',function(e){
    var svg=e.target.closest('svg#map');if(!svg)return;
    e.preventDefault();
    if(S.map3d){M3.zoom=Math.max(.3,Math.min(4,M3.zoom*(e.deltaY>0?.9:1.1)));M3.hoverT=Date.now();drawMap();return}
    var p=svgPoint(svg,e.clientX,e.clientY),f=e.deltaY>0?1.12:.89,v=M.view;
    var nw=Math.max(260,Math.min(2600,v.w*f)),r=nw/v.w;
    M.view={x:p.x-(p.x-v.x)*r,y:p.y-(p.y-v.y)*r,w:nw,h:v.h*r};
    applyView();drawMap();
  },{passive:false});


  /* ---------- Google Calendar sync (server side, dedicated "Atlas" calendar) ---------- */
  var gcq=Promise.resolve(),gcTimers={},gcPending=0,gcDone=0,gcErr='';
  function gcWanted(n){
    if(n.isComp)return !!n.deadline&&n.onCal!==false&&n.status!=='Missed'&&n.status!=='Won';
    return !!n.due&&!n.done&&!!n.parent&&!kidsOf(n.id).length;
  }
  function gcDate(n){return n.isComp?n.deadline:n.due}
  function gcTitle(n){return n.isComp?'Competition deadline: '+title(n):'['+rootOf(n).title+'] '+n.title}
  function gcDesc(n){
    var bits=[];
    if(n.isComp){if(n.status)bits.push('Status: '+n.status);if(n.prize)bits.push('Prize: '+n.prize);if(n.fee)bits.push('Fee: '+n.fee);if(isUrl(n.url))bits.push(n.url)}
    else{if(n.status)bits.push('Status: '+n.status);if(n.priority)bits.push('Priority: '+n.priority);var pp=pathOf(n);if(pp.length)bits.push(pp.join(' > '));if(isUrl(n.link))bits.push(n.link)}
    if(n.notes)bits.push(n.notes);
    return bits.join('\n');
  }
  function gcError(e){return 'Calendar did not answer: '+((e&&e.message)||e||'error')+'. Press Sync now to retry.'}
  function gcSyncOne(id){
    var n=node(id);if(!n)return Promise.resolve();
    var want=gcWanted(n),cur=n.gcalId||'';
    if(want)return gs('gcalUpsert',{eventId:cur,title:gcTitle(n),desc:gcDesc(n),date:gcDate(n)}).then(function(nid){if(nid&&nid!==cur)return setFields(id,{gcalId:nid})});
    if(cur)return gs('gcalDelete',cur).then(function(){return setFields(id,{gcalId:''})});
    return Promise.resolve();
  }
  function gcDelete(n){
    if(!S.sync||!n.gcalId)return;
    var eid=n.gcalId;
    gcq=gcq.then(function(){return gs('gcalDelete',eid)}).catch(function(e){S.syncState='err';S.syncMsg=gcError(e);gcUI()});
  }
  function gcRun(ids){
    gcPending+=ids.length;S.syncState='busy';gcUI();
    ids.forEach(function(id){
      gcq=gcq.then(function(){return gcSyncOne(id)}).then(function(){gcDone++;gcPending--;if(!gcPending){S.syncState=gcErr?'err':'ok';S.syncMsg=gcErr||('Synced '+gcDone+' item'+(gcDone===1?'':'s'));gcDone=0;gcUI()}else gcUI()})
        .catch(function(e){gcPending--;gcErr=gcError(e);S.syncState='err';S.syncMsg=gcErr;if(!gcPending){gcDone=0}gcUI()});
    });
  }
  function scheduleSync(id){
    if(!S.sync)return;
    clearTimeout(gcTimers[id]);
    gcTimers[id]=setTimeout(function(){gcErr='';gcRun([id])},900);
  }
  function gcSyncAll(){
    gcErr='';
    var ids=allNodes().filter(function(n){return gcWanted(n)||n.gcalId}).map(function(n){return n.id});
    if(!ids.length){S.syncState='ok';S.syncMsg='Nothing with a deadline to sync';gcUI();return}
    gcRun(ids);
  }
  function gcUI(){
    var b=$('#gc-btn'),n=$('#gc-now'),m=$('#gc-msg');if(!b)return;
    b.textContent='Google Calendar: '+(S.sync?'on':'off');
    b.setAttribute('aria-pressed',S.sync);
    b.className='btn'+(S.sync?' primary':'');
    n.hidden=!S.sync;
    m.textContent=S.sync?(S.syncState==='busy'?'Syncing…':S.syncMsg):'';
    m.style.color=S.syncState==='err'?'var(--red-fg)':'';
  }
  $('#gc-btn').addEventListener('click',function(){
    S.sync=!S.sync;persist();
    if(S.sync){S.syncMsg='';gcSyncAll()}else{S.syncState='';S.syncMsg=''}
    gcUI();
  });
  $('#gc-now').addEventListener('click',gcSyncAll);
  $('#focus-btn').addEventListener('click',function(){S.focus=!S.focus;if(S.focus&&S.view==='disc')S.view='outline';persist();render();toast(S.focus?'Focus on. Discovery is hidden.':'Focus off')});

  $('#today').textContent=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  S.selDay=today();

  function gs(name){
    var args=[].slice.call(arguments,1);
    return new Promise(function(res,rej){
      var r=google.script.run.withSuccessHandler(res).withFailureHandler(rej);
      r[name].apply(r,args);
    });
  }
  db=null;var APPN='Atlas';
  /* ---------- boot ---------- */
  $('#view').innerHTML='<div class="sheet"><div class="empty"><h2>Loading your tracker</h2>One moment.</div></div>';
  var COLS=['items','comps','disc','agents','runs','dir','notes','cfg','chat','assets','canvas'],cache={},subs={},sig={},inflight=0;COLS.forEach(function(c){cache[c]={};subs[c]=[];sig[c]=''});
  function emit(col){
    var s=JSON.stringify(cache[col]);if(s===sig[col])return;sig[col]=s;
    var docs=Object.keys(cache[col]).map(function(id){return {id:id,data:function(){return JSON.parse(JSON.stringify(cache[col][id]))}}});
    subs[col].forEach(function(f){f({docs:docs})});
  }
  function remote(col,id,fn){inflight++;return fn().then(function(r){inflight--;return r},function(e){inflight--;throw e})}
  db={
    collection:function(col){return {onSnapshot:function(ok){subs[col].push(ok);if(sig[col])ok({docs:[]});emit(col)}}},
    doc:function(path){
      var p=path.split('/'),col=p[0],id=p[1];
      return {
        set:function(d){cache[col][id]=JSON.parse(JSON.stringify(d));emit(col);return remote(col,id,function(){return gs('saveDoc',col,id,JSON.stringify(cache[col][id]))})},
        update:function(d){cache[col][id]=Object.assign(cache[col][id]||{},JSON.parse(JSON.stringify(d)));emit(col);return remote(col,id,function(){return gs('saveDoc',col,id,JSON.stringify(cache[col][id]))})},
        delete:function(){delete cache[col][id];emit(col);return remote(col,id,function(){return gs('deleteDoc',col,id)})}
      };
    }
  };
  function load(first){
    return gs('loadAll').then(function(r){
      if(!first&&inflight)return;
      COLS.forEach(function(c){var o={};Object.keys(r[c]||{}).forEach(function(id){o[id]=JSON.parse(r[c][id])});cache[c]=o});
      COLS.forEach(function(c){emit(c)});
    });
  }
  db.collection('items').onSnapshot(function(snap){rebuild(snap.docs);S.ready=true;render()});
  db.collection('comps').onSnapshot(function(snap){rebuildComps(snap.docs);render()});
  db.collection('disc').onSnapshot(function(snap){rebuildDisc(snap.docs);render()});
  ['agents','runs','dir','notes','cfg','assets','canvas'].forEach(function(c){db.collection(c).onSnapshot(function(snap){rebuildGen(c,snap.docs);render()})});
  gs('keyStatus').then(function(k){S.keys=k;render()}).catch(function(){});
  load(true).then(function(){
    var lastErr=0;
    setInterval(function(){if(!document.hidden&&!inflight)load(false).catch(function(){})},20000);
    if(sigEmpty())return;
  }).catch(function(e){$('#view').innerHTML='<div class="sheet"><div class="empty"><h2>Could not load the data</h2>'+esc((e&&e.message)||e)+'</div></div>'});
  function sigEmpty(){return false}
})();
</script>
