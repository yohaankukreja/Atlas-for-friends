<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Atlas</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one working page. Slim masthead with live counts, two views (Outline, Upcoming),
   outline rows in a single grid so every column lines up from project down to sub-task. */
:root{
  --bg:#f2f5f1; --surface:#ffffff; --ink:#16211b; --muted:#66736a; --line:#dde4dc; --hover:#f6f9f5;
  --accent:#2d6a4f; --accent-ink:#ffffff; --accent-soft:#e1efe7;
  --head-bg:#16211b; --head-ink:#f2f5f1; --head-muted:#9fb0a5;
  --grey-bg:#e9eee8; --grey-fg:#46534b;
  --blue-bg:#dbe8fb; --blue-fg:#1d4a8f;
  --red-bg:#fbdcd7; --red-fg:#9a2315;
  --amber-bg:#fbe9bd; --amber-fg:#7a5200;
  --green-bg:#d5ecdc; --green-fg:#1d6038;
  --font-display:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif;
  --font-body:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1411; --surface:#151c18; --ink:#e5ece6; --muted:#8a978e; --line:#26302a; --hover:#1a221d;
  --accent:#6fc39a; --accent-ink:#0e1411; --accent-soft:#1c2e25;
  --head-bg:#0a0f0c; --head-ink:#e5ece6; --head-muted:#7f8d84;
  --grey-bg:#222b25; --grey-fg:#b4c0b7;
  --blue-bg:#1b2c47; --blue-fg:#9fc3f5;
  --red-bg:#411e1a; --red-fg:#f3a79d;
  --amber-bg:#40320f; --amber-fg:#f1cf79;
  --green-bg:#173324; --green-fg:#8fd6a9; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1411; --surface:#151c18; --ink:#e5ece6; --muted:#8a978e; --line:#26302a; --hover:#1a221d;
  --accent:#6fc39a; --accent-ink:#0e1411; --accent-soft:#1c2e25;
  --head-bg:#0a0f0c; --head-ink:#e5ece6; --head-muted:#7f8d84;
  --grey-bg:#222b25; --grey-fg:#b4c0b7;
  --blue-bg:#1b2c47; --blue-fg:#9fc3f5;
  --red-bg:#411e1a; --red-fg:#f3a79d;
  --amber-bg:#40320f; --amber-fg:#f1cf79;
  --green-bg:#173324; --green-fg:#8fd6a9; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.mast{background:var(--head-bg);color:var(--head-ink);padding-block:18px 16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mast-in{max-width:1120px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.brand h1{font-family:var(--font-display);font-weight:700;font-size:26px;letter-spacing:-.01em;margin:0;line-height:1.1}
.brand p{margin:3px 0 0;color:var(--head-muted);font-family:var(--font-mono);font-size:12px}
.counts{display:flex;gap:22px;flex-wrap:wrap}
.count{display:flex;flex-direction:column;gap:1px}
.count b{font-family:var(--font-display);font-size:24px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.count span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--head-muted)}
.count.warn b{color:#f3a79d}

.side-up{position:fixed;top:120px;right:0;z-index:60;display:flex;align-items:flex-start;font-size:12.5px}
.side-up-tab{writing-mode:vertical-rl;text-orientation:mixed;background:var(--surface);border:1px solid var(--line);border-right:none;border-radius:8px 0 0 8px;padding:10px 7px;cursor:pointer;color:var(--muted);font-size:11.5px;letter-spacing:.02em}
.side-up.open .side-up-tab{color:var(--ink);border-color:var(--ink)}
.side-up-body{width:0;overflow:hidden;max-height:70vh;background:var(--surface);border:1px solid var(--line);border-radius:8px 0 0 8px;box-shadow:-4px 0 16px rgba(0,0,0,.12)}
.side-up.open .side-up-body{width:230px;overflow-y:auto}
.side-up-row{display:flex;align-items:center;gap:7px;padding:7px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.side-up-row:last-child{border-bottom:none}
.side-up-row:hover{background:var(--hover)}
.side-up-dot{width:8px;height:8px;border-radius:50%;flex:none}
.side-up-dot.red{background:var(--red-fg)}
.side-up-dot.amber{background:var(--amber-fg)}
.side-up-dot.green{background:var(--green-fg)}
.side-up-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.side-up-when{color:var(--muted);font-size:11px;flex:none}
.side-up-empty{padding:10px;color:var(--muted)}
@media (max-width:760px){.side-up{display:none}}
.ticker-wrap{margin-top:12px;max-width:1120px;margin-left:auto;margin-right:auto;overflow:hidden;white-space:nowrap;border-top:1px solid rgba(255,255,255,.15);cursor:pointer}
.ticker-wrap.empty{opacity:.6}
.ticker{display:inline-block;padding:7px 0;animation:tickscroll 38s linear infinite}
.ticker-wrap:hover .ticker{animation-play-state:paused}
.ticker-wrap.empty .ticker{animation:none}
@keyframes tickscroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tick-item{display:inline-block;padding:0 18px;font-size:12px;font-family:var(--font-mono);border-right:1px solid rgba(255,255,255,.15);color:var(--head-muted)}
.tick-item b{font-weight:700;margin-left:6px}
.tick-item.red b{color:#f3a79d}
.tick-item.amber b{color:#f1cf79}
.tick-item.green b{color:#8fd6a9}
@media (prefers-reduced-motion:reduce){.ticker{animation:none;white-space:normal}}

.wrap{max-width:1120px;margin:0 auto;padding-block:16px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.tabs,.chips{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:7px 12px;border-radius:6px;color:var(--muted);font-weight:500}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.tab.soon{opacity:.55}
.tab.soon::after{content:"soon";font-size:9px;letter-spacing:.06em;text-transform:uppercase;margin-left:5px;padding:1px 4px;border-radius:4px;background:var(--hover);color:var(--muted);vertical-align:middle}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 10px;min-width:180px}
.chip-b{border:1px solid var(--line);background:transparent;border-radius:6px;padding:5px 10px;font-size:12.5px;color:var(--muted)}
.chip-b[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:500}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 11px;font-size:13px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:500}
.btn.danger{color:var(--red-fg);border-color:transparent;background:var(--red-bg)}

.sheet{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.cols,.row{display:grid;grid-template-columns:minmax(0,1fr) 112px 92px 108px 132px 68px;gap:8px;align-items:center;padding:0 12px}
.cols{height:34px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);background:var(--hover)}
.row{min-height:40px;border-bottom:1px solid var(--line)}
.row:hover{background:var(--hover)}
.row.proj{min-height:52px;background:var(--surface);border-top:1px solid var(--line)}
.row.proj .ttl{font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:-.005em}
.row.d1 .ttl{font-weight:600}
.row.d2 .ttl,.row.d3 .ttl{font-weight:400}
.row.done .ttl{color:var(--muted);text-decoration:line-through}
.c-title{display:flex;align-items:center;gap:6px;min-width:0;padding-left:calc(var(--depth) * 22px)}
.ttl{flex:1;min-width:0;border:0;background:transparent;padding:6px 4px;border-radius:4px;text-overflow:ellipsis}
.ttl:focus{background:var(--surface);box-shadow:0 0 0 1px var(--accent)}
.chev{width:22px;height:22px;border:0;background:transparent;color:var(--muted);border-radius:4px;display:grid;place-items:center;flex:none;padding:0}
.chev:hover{background:var(--grey-bg)}
.chev.ghost{visibility:hidden}
.chev svg{transition:transform .12s}
.chev[aria-expanded="false"] svg{transform:rotate(-90deg)}
.chk{width:16px;height:16px;flex:none;accent-color:var(--accent);margin:0}
.prog{width:56px;height:5px;border-radius:3px;background:var(--grey-bg);flex:none;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.pnum{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.chip{font-size:11.5px;text-decoration:none;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);flex:none}
.area-tag{flex:none;width:92px;min-width:0;border:1px solid var(--line);background:var(--hover);border-radius:999px;padding:3px 10px;font-size:11.5px;color:var(--muted);text-align:center}
.area-tag:focus{background:var(--surface);box-shadow:0 0 0 1px var(--accent);color:var(--ink)}
.area-tag:not(:placeholder-shown){color:var(--ink)}
.mdue{display:none}

select.pill{appearance:none;-webkit-appearance:none;border:0;border-radius:999px;padding:3px 12px;font-size:12px;font-weight:500;cursor:pointer;max-width:100%;text-align:center;text-align-last:center}
.s-backlog,.s-todo{background:var(--grey-bg);color:var(--grey-fg)}
.s-inprogress{background:var(--blue-bg);color:var(--blue-fg)}
.s-blocked{background:var(--red-bg);color:var(--red-fg)}
.s-done{background:var(--green-bg);color:var(--green-fg)}
.p-high{background:var(--red-bg);color:var(--red-fg)}
.p-medium{background:var(--amber-bg);color:var(--amber-fg)}
.p-low{background:var(--green-bg);color:var(--green-fg)}
.p-none{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.o-sel{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
input.date{border:0;background:transparent;font-family:var(--font-mono);font-size:12px;padding:3px 2px;border-radius:4px;width:100%;color:var(--muted)}
input.date.over{color:var(--red-fg);font-weight:600}
input.date.soon{color:var(--amber-fg);font-weight:600}
.c-act{display:flex;gap:2px;justify-content:flex-end;opacity:0}
.row:hover .c-act,.row:focus-within .c-act,.row.open .c-act{opacity:1}
@media (hover:none){.c-act{opacity:1}}
.ib{width:28px;height:28px;border:0;background:transparent;border-radius:6px;display:grid;place-items:center;color:var(--muted);padding:0}
.ib:hover{background:var(--grey-bg);color:var(--ink)}

.detail{display:grid;grid-template-columns:2fr 1fr;gap:14px;padding:12px 16px 16px;border-bottom:1px solid var(--line);background:var(--hover)}
.detail label{display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.detail textarea,.detail input[type=text]{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 10px;font-size:13.5px;text-transform:none;letter-spacing:0;color:var(--ink);width:100%}
.detail textarea{min-height:84px;resize:vertical}
.d-side{display:flex;flex-direction:column;gap:10px;min-width:0}
.d-meta{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.d-act{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}

.add-row{display:flex;padding:8px 12px}
.add-row .btn{border-style:dashed;color:var(--muted)}

.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty h2{font-family:var(--font-display);color:var(--ink);margin:0 0 6px;font-size:20px}

.up-group{margin-bottom:18px}
.up-group h3{font-family:var(--font-display);font-size:15px;margin:0 0 8px;display:flex;gap:8px;align-items:baseline}
.up-group h3 small{font-family:var(--font-mono);font-weight:400;color:var(--muted);font-size:12px}
.up-item{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:6px}
.up-date{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.up-date.over{color:var(--red-fg);font-weight:600}
.up-t{min-width:0}
.up-t b{font-weight:600;display:block;overflow-wrap:anywhere}
.up-t span{color:var(--muted);font-size:12.5px}
.up-item a{white-space:nowrap;font-size:13px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--head-bg);color:var(--head-ink);padding:9px 14px;border-radius:8px;font-size:13px;max-width:90vw;z-index:9}

@media (max-width:760px){
  .cols .h-pr,.cols .h-ow,.cols .h-due,.c-pr,.c-ow,.c-due{display:none}
  .cols,.row{grid-template-columns:minmax(0,1fr) 104px 64px}
  .c-title{flex-wrap:wrap}
  .mdue{display:block;flex-basis:100%;padding-left:calc(28px + var(--depth) * 0px);font-family:var(--font-mono);font-size:11.5px;color:var(--muted)}
  .mdue.over{color:var(--red-fg)}
  .detail{grid-template-columns:1fr}
  .up-item{grid-template-columns:minmax(0,1fr);gap:4px}
  .search{min-width:0;flex:1}
  .counts{gap:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.crow{display:grid;grid-template-columns:minmax(0,1fr) 120px 128px 96px 68px;gap:8px;align-items:center;padding:0 12px;min-height:44px;border-bottom:1px solid var(--line)}
.crow:hover{background:var(--hover)}
.crow .ttl{font-weight:600}
.crow .ttl,.crow input.date{min-width:0}
.cols.cc{grid-template-columns:minmax(0,1fr) 120px 128px 96px 68px}
.left{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.left.over{color:var(--red-fg);font-weight:600}
.left.soon{color:var(--amber-fg);font-weight:600}
.linkbox{display:flex;flex-direction:column;gap:6px}
.linkbox select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px;font-size:13px;width:100%;text-transform:none;letter-spacing:0}
.lchips{display:flex;gap:6px;flex-wrap:wrap}
.lchip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 4px 2px 10px;font-size:12px;text-transform:none;letter-spacing:0}
.lchip button{border:0;background:transparent;color:inherit;width:18px;height:18px;border-radius:50%;padding:0;line-height:1}
.lchip button:hover{background:var(--grey-bg)}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.quick input[type=text],.quick select,.quick input[type=date]{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 10px}
.quick input[type=text]{flex:1;min-width:180px}

.mapbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.mapbar select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px}
.mapbar .grow{flex:1}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:1.5px solid var(--muted)}
.legend i.proj{background:var(--accent);border-color:var(--accent)}
.legend i.comp{background:var(--amber-bg);border-color:var(--amber-fg);border-radius:2px;transform:rotate(45deg)}
.legend i.lk{width:18px;height:0;border:0;border-top:2px dashed var(--accent);border-radius:0;vertical-align:3px}
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
svg#map{width:100%;height:min(70vh,640px);min-height:420px;display:block;touch-action:none;cursor:grab;user-select:none}
svg#map.linking{cursor:crosshair}
.edge{stroke:var(--muted);stroke-width:1;opacity:.45}
.edge.lnk{stroke:var(--accent);stroke-dasharray:5 4;stroke-width:1.8;opacity:.9}
.node{cursor:pointer}
.node .sh{stroke-width:1.5}
.n-proj{fill:var(--accent);stroke:var(--accent)}
.n-todo{fill:var(--surface);stroke:var(--muted)}
.n-prog{fill:var(--blue-bg);stroke:var(--blue-fg)}
.n-blocked{fill:var(--red-bg);stroke:var(--red-fg)}
.n-done{fill:var(--green-bg);stroke:var(--green-fg)}
.n-comp{fill:var(--amber-bg);stroke:var(--amber-fg)}
.node.sel .sh{stroke:var(--ink);stroke-width:3}
.node.dim,.edge.dim{opacity:.15}
.node.faint,.edge.faint{opacity:.35}
.help{position:relative;display:inline-block;margin-left:6px;vertical-align:middle}
.focusmenu{position:relative;display:inline-block}
.focusmenu summary{list-style:none;cursor:pointer}
.focusmenu summary::-webkit-details-marker{display:none}
.help summary{list-style:none;cursor:pointer;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);color:var(--muted);font-size:11px;line-height:16px;text-align:center;background:var(--surface)}
.help summary::-webkit-details-marker{display:none}
.help[open] summary{color:var(--ink);border-color:var(--ink)}
.help-pop{position:absolute;z-index:40;top:24px;left:0;width:260px;max-width:70vw;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.4;color:var(--ink);box-shadow:0 6px 20px rgba(0,0,0,.2)}
.bang-ib{width:18px;height:18px;border-radius:50%;border:1px solid var(--amber-fg,var(--line));color:var(--amber-fg,var(--muted));font-size:11px;line-height:16px;text-align:center;background:var(--surface);padding:0;flex:none}
.bang-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px}
.bang-box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;max-width:560px;width:100%;max-height:80vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.35);color:var(--ink)}
text.lbl{fill:var(--ink);font-size:11px;font-family:var(--font-body);paint-order:stroke;stroke:var(--surface);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}
text.lbl.p{font-family:var(--font-display);font-weight:700;font-size:14px}
.mapinfo{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.mapinfo b{font-family:var(--font-display);font-size:16px}
.mapinfo .sub{color:var(--muted);font-size:12.5px}
.hint{color:var(--muted);font-size:13px}

.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cal-head h2{font-family:var(--font-display);font-size:20px;margin:0 8px 0 0;min-width:170px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);background:var(--surface);border-radius:8px;overflow:hidden}
.cal-dow{padding:6px 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--hover)}
.cal-day{min-height:96px;padding:4px 5px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal-day:hover{background:var(--hover)}
.cal-day.other{opacity:.45}
.cal-day.sel{background:var(--accent-soft)}
.cal-day .dn{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.cal-day.today .dn{color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:0 6px;align-self:flex-start;font-weight:600}

    dots:'<svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><circle cx="3" cy="7" r="1.2"/><circle cx="7" cy="7" r="1.2"/><circle cx="11" cy="7" r="1.2"/></svg>'
  };

  /* ---------- data ---------- */
  function rebuild(docs){
    var items={},kids={};
    docs.forEach(function(d){var v=d.data();items[d.id]=Object.assign({id:d.id},v)});
    Object.keys(items).forEach(function(id){var p=items[id].parent||'';if(p&&!items[p])items[id].parent='';(kids[items[id].parent||'']=kids[items[id].parent||'']||[]).push(items[id])});
    Object.keys(kids).forEach(function(k){kids[k].sort(function(a,b){return (a.order||0)-(b.order||0)})});
    S.items=items;S.kids=kids;
  }
  function rebuildComps(docs){var c={};docs.forEach(function(d){c[d.id]=Object.assign({id:d.id,isComp:true},d.data())});S.comps=c}
  function reload(){rebuild(Object.keys(S.items).map(function(k){return {id:k,data:function(){return S.items[k]}}}));render()}
  function kidsOf(id){return S.kids[id||'']||[]}
  function node(id){var n=S.items[id]||S.comps[id]||(S.assets&&S.assets[id])||(S.rd&&S.rd[id]);if(n&&!n.kind&&S.rd&&S.rd[id]===n)n.kind='rd';return n}
  function allNodes(){return Object.keys(S.items).map(function(k){return S.items[k]}).concat(Object.keys(S.comps).map(function(k){return S.comps[k]}))}
  function rootOf(n){while(n.parent&&S.items[n.parent])n=S.items[n.parent];return n}
  function leaves(n,out){out=out||[];var k=kidsOf(n.id);if(!k.length)out.push(n);else k.forEach(function(c){leaves(c,out)});return out}
  function progress(n){if(!kidsOf(n.id).length)return null;var l=leaves(n),d=l.filter(function(x){return x.done}).length;return {d:d,t:l.length,pct:Math.round(100*d/l.length)}}
  function depthOf(n){var d=0;while(n.parent&&S.items[n.parent]){n=S.items[n.parent];d++}return d}
  function isOverdue(n){return !!n.due&&!n.done&&n.due<today()}
  function descendants(n,out){out=out||[];kidsOf(n.id).forEach(function(c){out.push(c);descendants(c,out)});return out}
  function maxOrder(pid){var k=kidsOf(pid);return k.length?k[k.length-1].order:0}
  function pathOf(n){var p=[];while(n.parent&&S.items[n.parent]){n=S.items[n.parent];p.unshift(n.title)}return p}
  function title(n){return n.isComp?(n.name||'Untitled competition'):(n.kind==='repo'||n.kind==='method'||n.kind==='rd'?(n.name||'Untitled'):(n.title||'Untitled'))}

  function write(id,patch){
    var col=S.comps[id]?'comps':'items';
    var p=(chains[id]||Promise.resolve()).then(function(){return db.doc(col+'/'+id).update(patch)})
      .catch(function(e){toast('Could not save'+(e&&e.code==='invalid_argument'?': you have view-only access':''))});
    chains[id]=p;return p;
  }
  var SYNCKEYS=['onCal','due','deadline','title','name','done','status','notes','link','url','priority','parent'];
  function setFields(id,patch){
    var n=node(id);if(!n)return Promise.resolve();Object.assign(n,patch);
    var p=write(id,patch);
    if(S.sync&&SYNCKEYS.some(function(k){return k in patch}))scheduleSync(id);
    return p;
  }
  function stamped(n,p){
    var o=Object.assign({},p),nowS=today();
    if('done' in p){
      if(p.done){o.status='Done';if(!n.finished)o.finished=nowS}
      else{if(n.status==='Done')o.status='To do';o.finished=''}
    }else if('status' in p){
      if(p.status==='Done'){o.done=true;if(!n.finished)o.finished=nowS}
      else{if(n.done){o.done=false;o.finished=''}if(p.status==='In progress'&&!n.started)o.started=nowS}
    }
    return o;
  }
  function syncParent(n){
    var p=n.parent&&S.items[n.parent];if(!p||!p.parent)return;
    var all=kidsOf(p.id).every(function(k){return k.done});
    if(all&&!p.done)setFields(p.id,stamped(p,{done:true})).then(function(){syncParent(p)});
    else if(!all&&p.done)setFields(p.id,stamped(p,{done:false})).then(function(){syncParent(p)});
  }
  function changeItem(id,p){
    var n=S.items[id];if(!n)return;
    var patch=stamped(n,p);
    var chain=setFields(id,patch);
    if('done' in patch&&patch.done&&kidsOf(id).length){descendants(n).forEach(function(c){if(!c.done)setFields(c.id,stamped(c,{done:true}))})}
    chain.then(function(){syncParent(n);render()});
    render();
  }
  function newId(pre){return pre+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
  S.offQueue=[];S.offSyncing=false;
  function offLoad(){try{S.offQueue=JSON.parse(localStorage.getItem('atlas-offline-queue')||'[]')}catch(e){S.offQueue=[]}}
  function offSave(){try{localStorage.setItem('atlas-offline-queue',JSON.stringify(S.offQueue))}catch(e){}}
  function offSyncOne(text){
    var id=newId('i');
    var doc={title:text||'',parent:'',order:maxOrder('')+1,done:false,status:'To do',priority:'',owner:'Me',due:'',notes:'',link:'',links:[],added:today(),started:'',finished:''};
    return db.doc('items/'+id).set(doc).then(function(){
      S.items[id]=Object.assign({id:id},doc);(S.kids['']=S.kids['']||[]).push(S.items[id]);
      return id;
    });
  }
  function offSyncNow(){
    if(!S.offQueue.length||S.offSyncing)return;
    S.offSyncing=true;render();
    var queue=S.offQueue.slice();
    (function step(i){
      if(i>=queue.length){S.offSyncing=false;offSave();render();toast('Offline items synced to your Outline');return}
      offSyncOne(queue[i].text).then(function(){
        S.offQueue=S.offQueue.filter(function(o){return o.id!==queue[i].id});
        offSave();render();
        step(i+1);
      }).catch(function(){S.offSyncing=false;render()});
    })(0);
  }
  function addItem(pid,ttl,due){
    var id=newId('i'),isProj=!pid;
    var doc={title:ttl||'',parent:pid||'',order:maxOrder(pid||'')+1,done:false,status:isProj?'':'To do',priority:'',owner:isProj?'':'Me',due:due||'',notes:'',link:'',links:[],added:today(),started:'',finished:''};
    S.items[id]=Object.assign({id:id},doc);(S.kids[pid||'']=S.kids[pid||'']||[]).push(S.items[id]);
    if(pid){S.collapsed[pid]=false;persist()}
    if(!ttl)S.focusNew=id;
    render();
    db.doc('items/'+id).set(doc).then(function(){if(S.sync&&doc.due)scheduleSync(id)}).catch(function(){toast('Could not add item')});
    return id;
  }
  function addComp(name,due){
    var id=newId('c');
    var doc={name:name||'',deadline:due||'',status:'Idea',url:'',fee:'',prize:'',notes:'',links:[],added:today()};
    S.comps[id]=Object.assign({id:id,isComp:true},doc);
    S.copen=id;S.focusNew='c:'+id;render();
    db.doc('comps/'+id).set(doc).then(function(){if(S.sync&&doc.deadline)scheduleSync(id)}).catch(function(){toast('Could not add competition')});
  }
  function swap(a,b){var oa=a.order,ob=b.order;return Promise.all([setFields(a.id,{order:ob}),setFields(b.id,{order:oa})])}
  function move(id,dir){
    var n=S.items[id],sib=kidsOf(n.parent),i=sib.indexOf(n),o=sib[i+dir];
    if(!o){toast(dir<0?'Already first':'Already last');return}
    swap(n,o).then(reload);
  }
  function indent(id){
    var n=S.items[id],sib=kidsOf(n.parent),i=sib.indexOf(n),p=sib[i-1];
    if(!p){toast('Nothing above to nest under');return}
    S.collapsed[p.id]=false;persist();
    setFields(id,{parent:p.id,order:maxOrder(p.id)+1});reload();
  }
  function outdent(id){
    var n=S.items[id],q=S.items[n.parent];
    if(!q){toast('Already top level');return}
    var sib=kidsOf(q.parent),i=sib.indexOf(q),nx=sib[i+1];
    setFields(id,{parent:q.parent||'',order:nx?(q.order+nx.order)/2:q.order+1});reload();
  }
  function removeItem(id){
    var n=S.items[id],all=[n].concat(descendants(n));
    all.forEach(function(x){if(x.gcalId)gcDelete(x)});
    all.forEach(function(x){delete S.items[x.id]});S.open=null;reload();
    all.reduce(function(p,x){return p.then(function(){return db.doc('items/'+x.id).delete()})},Promise.resolve())
      .catch(function(){toast('Could not delete everything')});
  }
  function removeComp(id){if(S.comps[id]&&S.comps[id].gcalId)gcDelete(S.comps[id]);delete S.comps[id];S.copen=null;render();db.doc('comps/'+id).delete().catch(function(){toast('Could not delete')})}

  /* ---------- links between nodes (the mind map) ---------- */
  function linkedIds(id){
    var n=node(id),set={};if(!n)return [];
    (n.links||[]).forEach(function(x){if(node(x))set[x]=1});
    allNodes().forEach(function(m){if((m.links||[]).indexOf(id)>-1)set[m.id]=1});
    return Object.keys(set);
  }
  function toggleLink(a,b){
    if(a===b)return;
    var A=node(a),B=node(b);if(!A||!B)return;
    var la=(A.links||[]).slice(),lb=(B.links||[]).slice(),i;
    if((i=la.indexOf(b))>-1){la.splice(i,1);setFields(a,{links:la})}
    else if((i=lb.indexOf(a))>-1){lb.splice(i,1);setFields(b,{links:lb})}
    else{la.push(b);setFields(a,{links:la})}
  }
  function linkOptions(exclude){
    var out=[];
    (function walk(pid,d){kidsOf(pid).forEach(function(n){if(n.id!==exclude)out.push([n.id,new Array(d+1).join('  ')+(n.title||'Untitled')]);walk(n.id,d+1)})})('',0);
    Object.keys(S.comps).forEach(function(k){if(k!==exclude)out.push([k,'Opportunity: '+title(S.comps[k])])});
    return out;
  }
  function linkBox(n){
    var ids=linkedIds(n.id);
    var h='<label>Linked to<span class="linkbox"><select data-act="addlink" aria-label="Link to another item"><option value="">Link to another step or competition</option>'+
      linkOptions(n.id).map(function(o){return '<option value="'+o[0]+'">'+esc(o[1])+'</option>'}).join('')+'</select>';
    if(ids.length)h+='<span class="lchips">'+ids.map(function(x){var m=node(x);return '<span class="lchip">'+esc(title(m))+'<button data-act="rmlink" data-to="'+x+'" aria-label="Remove link">×</button></span>'}).join('')+'</span>';
    return h+'</span></label>';
  }

  /* ---------- filters ---------- */
  function selfMatch(n){
    if(S.q&&n.title.toLowerCase().indexOf(S.q)<0)return false;
    if(S.flt==='active'&&n.done)return false;
    if(S.flt==='overdue'&&!isOverdue(n))return false;
    if(S.hideDone&&n.done)return false;
    return true;
  }
  function areaOk(n){return !S.areaFlt||(rootOf(n).area||'')===S.areaFlt}
  function shows(n){return areaOk(n)&&(selfMatch(n)||kidsOf(n.id).some(shows))}
  function collapsed(n){return !S.q&&S.flt==='all'&&!S.hideDone?!!S.collapsed[n.id]:false}

  /* ---------- calendar links / exports ---------- */
  function gcalUrl(text,date,details){
    return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(text)+
      '&dates='+date.replace(/-/g,'')+'/'+addDays(date,1).replace(/-/g,'')+'&details='+encodeURIComponent(details||'');
  }
  function gcal(n){
    if(n.isComp)return gcalUrl('Opportunity deadline: '+title(n),n.deadline,(n.notes||'')+(isUrl(n.url)?'\n'+n.url:''));
    var r=rootOf(n);
    return gcalUrl('['+r.title+'] '+n.title,n.due,(n.notes||'')+(isUrl(n.link)?'\n'+n.link:''));
  }
  function csvCell(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
  function saveFile(filename,data,okMsg){
    var o=document.createElement('div');
    o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:99;display:flex;align-items:center;justify-content:center;padding:16px';
    o.innerHTML='<div style="background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:16px;width:min(720px,100%);max-height:90vh;display:flex;flex-direction:column;gap:10px"><b>'+esc(filename)+'</b><textarea readonly style="flex:1;min-height:280px;font:12px/1.4 var(--font-mono,monospace);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px"></textarea><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn primary" data-a="copy">Copy</button><button class="btn" data-a="dl">Download</button><button class="btn" data-a="x">Close</button></div></div>';
    document.body.appendChild(o);
    var ta=o.querySelector('textarea');ta.value=data;
    o.addEventListener('click',function(e){
      var a=e.target.getAttribute&&e.target.getAttribute('data-a');
      if(a==='x'||e.target===o){o.remove();return}
      if(a==='copy'){ta.select();try{document.execCommand('copy');toast('Copied. '+okMsg)}catch(x){toast('Select all and copy')}}
      if(a==='dl'){try{var u=URL.createObjectURL(new Blob([data],{type:'text/plain'})),l=document.createElement('a');l.href=u;l.download=filename;document.body.appendChild(l);l.click();l.remove()}catch(x){toast('Download blocked here. Use Copy.')}}
    });
  }
  function events(){
    var out=[];
    allNodes().forEach(function(n){
      if(n.isComp){if(n.deadline&&n.status!=='Missed'&&n.onCal!==false)out.push({date:n.deadline,title:'Opportunity deadline: '+title(n),node:n,kind:'c',done:n.status==='Won'||n.status==='Submitted'})}
      else if(n.due&&n.parent&&!kidsOf(n.id).length)out.push({date:n.due,title:'['+rootOf(n).title+'] '+n.title,node:n,kind:'t',done:n.done});
    });
    return out;
  }
  function exportCsv(){
    var ev=events().filter(function(e){return !e.done}).sort(function(a,b){return a.date<b.date?-1:1});
    if(!ev.length){toast('Nothing with an open deadline yet');return}
    var rows=[['Subject','Start Date','End Date','All Day Event','Description']];
    ev.forEach(function(e){var d=new Date(e.date+'T00:00:00'),us=pad(d.getMonth()+1)+'/'+pad(d.getDate())+'/'+d.getFullYear();
      rows.push([e.title,us,us,'True',(e.node.notes||'')])});
    saveFile('Atlas-calendar.csv',rows.map(function(r){return r.map(csvCell).join(',')}).join('\n'),'Saved. In Google Calendar: Settings > Import & export > Import');
  }
  function planMd(){
    var L=['# Project plan','','_Exported '+today()+'. Open in Obsidian: each step is a [[wikilink]], so the graph view shows how steps connect._',''];
    function nm(id){var n=node(id);return n?'[[' + title(n).replace(/[\[\]|#^]/g,'') + ']]':''}
    function meta(n){
      var m=[];if(n.status&&n.status!=='To do')m.push('#'+slug(n.status));
      if(n.priority)m.push('priority:: '+n.priority);if(n.owner)m.push('owner:: '+ownerName(n.owner));
      if(n.due)m.push('due:: '+n.due);
      var ids=linkedIds(n.id);if(ids.length)m.push('links:: '+ids.map(nm).join(', '));
      if(isUrl(n.link))m.push('folder:: '+n.link);
      return m.length?' '+m.join(' · '):'';
    }
    (function walk(pid,d){kidsOf(pid).forEach(function(n){
      var ind=new Array(d+1).join('  ');
      if(d===0){L.push('## '+nm(n.id).replace(/^\[\[|\]\]$/g,''));var ids=linkedIds(n.id);if(ids.length)L.push('links:: '+ids.map(nm).join(', '));L.push('')}
      else L.push(ind.slice(2)+'- ['+(n.done?'x':' ')+'] '+nm(n.id)+meta(n));
      if(n.notes&&d>0)L.push(ind+'  > '+String(n.notes).replace(/\n/g,' '));
      walk(n.id,d+1);
      if(d===0)L.push('');
    })})('',0);
    var cs=Object.keys(S.comps).map(function(k){return S.comps[k]}).sort(function(a,b){return (a.deadline||'9')<(b.deadline||'9')?-1:1});
    if(cs.length){L.push('## Competitions','');cs.forEach(function(c){
      var ids=linkedIds(c.id);
      L.push('- '+nm(c.id)+' · '+c.status+(c.deadline?' · due:: '+c.deadline:'')+(c.fee?' · fee:: '+c.fee:'')+(c.prize?' · prize:: '+c.prize:'')+(ids.length?' · links:: '+ids.map(nm).join(', '):'')+(isUrl(c.url)?' · '+c.url:''));
      if(c.notes)L.push('  > '+String(c.notes).replace(/\n/g,' '));
    })}
    return L.join('\n')+'\n';
  }

  function ticker(){

  /* A small, always-there side panel (desktop/laptop only — hidden under 760px, the ticker already covers phones)

  /* ---------- render: outline ---------- */
  function rowHTML(n,depth){
    var k=kidsOf(n.id),has=k.length>0,col=collapsed(n),pr=progress(n),isProj=depth===0;
    var dueCls=n.due&&!n.done?(n.due<today()?' over':(n.due<=addDays(today(),3)?' soon':'')):'';
    var nl=linkedIds(n.id).length;
    var h='<div class="row d'+Math.min(depth,3)+(isProj?' proj':'')+(n.done?' done':'')+(S.open===n.id?' open':'')+'" data-id="'+n.id+'" style="--depth:'+depth+'">';

    var groups=[['Overdue','overdue',list.filter(function(e){return e.date<t})],['Next 7 days','next7',list.filter(function(e){return e.date>=t&&e.date<=wk})],['Later','later',list.filter(function(e){return e.date>wk})]];

  /* ---------- render: calendar > gantt ---------- */
  function dayClamped(ds,y,m,dim){
    var d=new Date(ds+'T00:00:00');
    if(d.getFullYear()===y&&d.getMonth()===m)return d.getDate();
    return ds<fmt(new Date(y,m,1))?1:dim;
  }
  function renderGantt(){
    var y=S.calY,m=S.calM,first=new Date(y,m,1),dim=new Date(y,m+1,0).getDate(),t=today();
    var monFirst=fmt(first),monLast=fmt(new Date(y,m,dim));
    var rows=calEvents().filter(function(e){return !e.done}).map(function(e){
      var n=e.node,due=e.date,st=(!n.isComp&&n.start)?n.start:due;
      if(st>due)st=due;
      return {node:n,title:title(n),isComp:!!n.isComp,start:st,due:due};
    }).filter(function(r){return r.due>=monFirst&&r.start<=monLast});
    rows.sort(function(a,b){return a.start<b.start?-1:a.start>b.start?1:(a.due<b.due?-1:1)});
    rows.forEach(function(r){r.clash=false});
    for(var i=0;i<rows.length;i++)for(var j=i+1;j<rows.length;j++){
      if(rows[i].start<=rows[j].due&&rows[j].start<=rows[i].due){rows[i].clash=true;rows[j].clash=true}
    }
    var clashN=rows.filter(function(r){return r.clash}).length;
    var h='<div class="cal-head"><h2>'+first.toLocaleDateString('en-GB',{month:'long',year:'numeric'})+'</h2>'+
      '<button class="btn" data-act="calprev" aria-label="Previous month">‹</button><button class="btn" data-act="caltoday">Today</button><button class="btn" data-act="calnext" aria-label="Next month">›</button></div>';
    if(clashN)h+='<p class="hint gantt-warn">⚠ '+clashN+' item(s) overlap in date this month — check the highlighted bars below.</p>';
    if(!rows.length)return h+'<div class="sheet"><div class="empty"><h2>Nothing scheduled this month</h2>Give a task a due date (and, optionally, a "Start date" in its details, for a multi-day bar) to see it here.</div></div>';
    var cols='minmax(160px,220px) repeat('+dim+',minmax(22px,1fr))';
    h+='<div class="gantt-wrap"><div class="gantt-grid" style="grid-template-columns:'+cols+'">';
    h+='<div class="gantt-cell gantt-corner" style="grid-row:1;grid-column:1"></div>';
    for(var d=1;d<=dim;d++){
      var ds=fmt(new Date(y,m,d));
      h+='<div class="gantt-cell gantt-dh'+(ds===t?' today':'')+'" style="grid-row:1;grid-column:'+(d+1)+'">'+d+'</div>';
    }
    rows.forEach(function(r,ri){
      var row=ri+2,si=dayClamped(r.start,y,m,dim),ei=dayClamped(r.due,y,m,dim);
      h+='<div class="gantt-cell gantt-label" style="grid-row:'+row+';grid-column:1" title="'+esc(r.title)+'">'+esc(r.title)+'</div>';
      h+='<div class="gantt-bar'+(r.isComp?' c':'')+(r.clash?' clash':'')+'" style="grid-row:'+row+';grid-column:'+(si+1)+' / '+(ei+2)+'" title="'+esc(r.title)+' · '+esc(dateLabel(r.start))+(r.due!==r.start?' – '+esc(dateLabel(r.due)):'')+'">'+esc(r.title)+'</div>';
    });
    h+='</div></div>';
    return h;
  }

  /* ---------- render: calendar ---------- */

  /* ---------- render: map ---------- */
  function mapVisible(){
    if(S.mapIso&&S.mapIso.length){
      var viso={};
      S.mapIso.forEach(function(id){
        if(!node(id))return;viso[id]=1;
        if(S.mapIndirect){
          linkedIds(id).forEach(function(o){if(node(o))viso[o]=1});
          var n=node(id);if(n&&!n.isComp&&n.parent&&node(n.parent))viso[n.parent]=1;
        }
      });
      return viso;
    }
    var layer=S.mapLayer||'tasks';
    if(layer==='rd'){
      var visR={};
      Object.keys(S.rd||{}).forEach(function(k){visR[k]=1});
      Object.keys(visR).slice().forEach(function(id){linkedIds(id).forEach(function(o){if(node(o))visR[o]=1})});
      return visR;
    }
    var all=allNodes(),vis={};
    if(layer!=='tasks')Object.keys(S.assets||{}).forEach(function(k){if(S.assets[k].kind==='repo')all.push(S.assets[k])});
    all.forEach(function(n){
      if(n.isComp)return;
      if(n.kind==='repo'){if(layer==='tasks')return;vis[n.id]=1;return}
      if(layer==='repos')return;
      var d=depthOf(n);
      if(!S.mapSub&&d>=2)return;
      if(S.mapProj&&rootOf(n).id!==S.mapProj)return;
      if(S.mapStatus&&d>0&&(n.status||'To do')!==S.mapStatus)return;
      vis[n.id]=1;
    });
    // pull in direct cross-links (one hop) so connections to other projects stay visible
    Object.keys(vis).slice().forEach(function(id){linkedIds(id).forEach(function(o){var n=node(o);
      if(!n)return;if(n.isComp){vis[o]=1;return}
      if(S.mapSub||depthOf(n)<2)vis[o]=1})});
    if(!S.mapProj&&layer!=='repos')Object.keys(S.comps).forEach(function(k){vis[k]=1});
    return vis;
  }
  function mapEdges(vis){
    var e=[];
    Object.keys(vis).forEach(function(id){var n=node(id);
      if(n.kind==='repo'){if(n.tag&&vis[n.tag])e.push({a:id,b:n.tag,t:'l'});return}
      if(!n.isComp&&n.parent&&vis[n.parent])e.push({a:n.parent,b:id,t:'h'});
      (n.links||[]).forEach(function(o){if(vis[o]&&node(o))e.push({a:id,b:o,t:'l'})});
    });
    return e;
  }
  function nodeR(n){if(n.kind==='repo')return 11;if(n.kind==='rd')return 13;if(n.isComp)return 9;var d=depthOf(n);return d===0?17:d===1?10:6}
  function sim(ids,edges,iters,fixed){
    var P=M.pos,V={};
    ids.forEach(function(id){V[id]={x:0,y:0}});
    for(var it=0;it<iters;it++){
      var cool=1-it/iters*.7;
      for(var i=0;i<ids.length;i++){
        var a=ids[i],pa=P[a];
        for(var j=i+1;j<ids.length;j++){
          var b=ids[j],pb=P[b],dx=pa.x-pb.x,dy=pa.y-pb.y,d2=dx*dx+dy*dy+30;
          if(d2>160000)continue;
          var f=2600/d2,d=Math.sqrt(d2);dx=dx/d*f;dy=dy/d*f;
          V[a].x+=dx;V[a].y+=dy;V[b].x-=dx;V[b].y-=dy;
        }
      }
      edges.forEach(function(e){
        var pa=P[e.a],pb=P[e.b],dx=pb.x-pa.x,dy=pb.y-pa.y,d=Math.sqrt(dx*dx+dy*dy)+.01;

  function discClick(act,b,id){
    if(act==='dtopicadd'){var v=$('#d-topic').value.trim();if(!v){toast('Type a topic first');return true}dadd({kind:'topic',name:v,status:'Curious'});return true}
    if(act==='dlearnadd'){var u=$('#d-url').value.trim();if(!u){toast('Paste a link first');return true}
      dadd({kind:'learn',url:isUrl(u)?u:'',title:isUrl(u)?'':u,status:'Queued',topic:'',summary:'',explain:'',use:''});toast('Queued. Now send me the link in chat.');return true}
    if(act==='dideaadd'){var t=$('#d-idea').value.trim();if(!t){toast('Type the idea first');return true}
      dadd({kind:'idea',text:t,project:$('#d-idea-proj').value,stage:'New',learnId:'',taskId:''});return true}
    if(act==='dlopen'){S.dopen=S.dopen===id?null:id;S.delArm=null;render();return true}
    if(act==='dlidea'){dadd({kind:'idea',text:'',project:'',stage:'New',learnId:id,taskId:''});return true}
    if(act==='ddel'){if(S.delArm===id){delete S.disc[id];S.delArm=null;render();db.doc('disc/'+id).delete().catch(function(){toast('Could not delete')})}else{S.delArm=id;render()}return true}
    if(act==='dpromote'){var i=S.disc[id];if(!i||!(i.text||'').trim()){toast('Write the idea first');return true}
      if(!i.project){toast('Pick a project for this idea first');return true}
      var ni=addItem(i.project,i.text.trim());dwrite(id,{stage:'Promoted',taskId:ni});toast('Added to the outline under '+title(S.items[i.project]));return true}
    if(act==='dgoto'){var j=S.disc[id];if(j&&S.items[j.taskId]){S.open=j.taskId;S.view='outline';var q=S.items[j.taskId];while(q.parent&&S.items[q.parent]){q=S.items[q.parent];S.collapsed[q.id]=false}persist();render()}return true}
    return false;
  }
  function discChange(t,act,k,id){
    if(act==='dtstatus'||act==='dlstatus'){dwrite(id,{status:t.value});render();return true}

    if(act==='diproj'){dwrite(id,{project:t.value});render();return true}

    return false;
  }

  function whClick(act,b,id){
    if(act==='whview'){S.wh=b.dataset.v;S.delArm=null;render();return true}
    if(act==='brandview'){S.brandView=b.dataset.v;render();return true}
    if(act==='brandtowh'){S.view='warehouse';S.wh='digital';persist();render();return true}
    if(act==='offadd'){
      var ot=$('#off-text'),txt=ot?ot.value:'';
      if(!txt||!txt.trim())return true;
      txt.split('\n').map(function(l){return l.trim()}).filter(Boolean).forEach(function(line){
        S.offQueue.push({id:newId('off'),text:line,added:new Date().toISOString()});
      });
      offSave();if(ot)ot.value='';render();toast('Saved here — will sync when you\'re online');
      return true;
    }
    if(act==='offdel'){var offid=b.dataset.id;S.offQueue=S.offQueue.filter(function(o){return o.id!==offid});offSave();render();return true}
    if(act==='offsync'){offSyncNow();return true}
    if(act==='whsync'){gs('mirrorWarehouse').then(function(u){S.whUrl=u;toast('Sheet updated');render()}).catch(function(e){toast('Could not sync: '+((e&&e.message)||e))});return true}
    if(act==='anew'){var aid=newId('w'),doc=S.wh==='physical'?{kind:'physical',name:'',location:'',qty:'',need:'Have',priority:'None',supplier:'',tag:'',notes:'',due:'',taskId:'',added:today()}:{kind:'supplier',name:'',contact:'',sells:'',purchasesUrl:'',purchases:'',stored:'',qty:'',priority:'None',tag:'',added:today()};
      S.assets[aid]=Object.assign({id:aid},doc);S.focusNew='as:'+aid;render();db.doc('assets/'+aid).set(doc).catch(function(){toast('Could not add')});wmirror();return true}
    if(act==='adel'){
      if(S.delArm===id){
        var isRepo=S.assets[id]&&S.assets[id].kind==='repo';
        delete S.assets[id];S.delArm=null;render();
        if(isRepo){delete cache.assets[id];emit('assets');gs('repoDelete',id).catch(function(){toast('Could not delete')})}
        else db.doc('assets/'+id).delete().catch(function(){toast('Could not delete')});
        wmirror();
      }else{S.delArm=id;render()}
      return true;
    }
    if(act==='repoadd'){
      var rtitle=$('#repo-title').value.trim(),rlink=$('#repo-link').value.trim(),rtag=$('#repo-tag').value,rtext=$('#repo-text').value.trim();
      if(!rtext){toast('Paste some text to index first');return true}
      b.disabled=true;toast('Indexing… this can take a little while for a long source');
      gs('repoAdd',{title:rtitle,link:rlink,text:rtext,projects:rtag?[rtag]:[]}).then(function(r){toast('Indexed '+r.chunks+' chunk(s)'+(r.summary?': '+r.summary:''));return load(true)}).then(function(){render()}).catch(function(e){toast('Could not index: '+((e&&e.message)||e));b.disabled=false});
      return true;
    }
    if(act==='repofill'){
      var fid=b.dataset.id,ta=document.querySelector('[data-repotext="'+fid+'"]'),ftext=ta?ta.value.trim():'';
      if(!ftext){toast('Paste some text first');return true}
      b.disabled=true;toast('Indexing…');
      gs('repoAddText',fid,ftext).then(function(r){toast('Indexed '+r.chunks+' chunk(s)');return load(true)}).then(function(){render()}).catch(function(e){toast('Could not index: '+((e&&e.message)||e));b.disabled=false});
      return true;
    }
    if(act==='reposum'){
      var rid=b.dataset.id;S.repoSumBusy=rid;S.repoHandoff=null;render();
      gs('repoSummaryDoc',rid).then(function(r){
        S.repoSumBusy=null;
        if(r&&r.handoff){S.repoHandoff={id:rid,docId:r.docId,docUrl:r.docUrl};toast('No AI key set — opened a Doc for you');render();return}
        if(S.assets[rid])S.assets[rid].docLink=r.docUrl;
        toast('Notes doc written');render();
      }).catch(function(e){S.repoSumBusy=null;toast('Could not write notes: '+((e&&e.message)||e));render()});
      return true;
    }
    if(act==='repocheckhandoff'){
      var rid2=b.dataset.id,hd2=S.repoHandoff;if(!hd2){return true}
      gs('repoSummaryDocFinish',rid2,hd2.docId).then(function(r){
        if(!r||!r.ready){toast('No answer in the Doc yet');return}
        if(S.assets[rid2])S.assets[rid2].docLink=r.docUrl;
        S.repoHandoff=null;toast('Notes doc written');render();
      }).catch(function(e){toast('Could not check: '+((e&&e.message)||e))});
      return true;
    }
    if(act==='repobulk'){
      var blinks=($('#bulk-links').value||'').split('\n').map(function(s){return s.trim()}).filter(Boolean);
      var btitles=($('#bulk-titles').value||'').split('\n').map(function(s){return s.trim()}).filter(Boolean);
      var bfileInput=$('#bulk-files'),bfl=bfileInput&&bfileInput.files?Array.prototype.slice.call(bfileInput.files):[];
      var btag=$('#repo-tag')?$('#repo-tag').value:'';
      if(!blinks.length&&!btitles.length&&!bfl.length){toast('Add some links, titles or files first');return true}
      b.disabled=true;toast('Processing batch… this can take a minute');
      var readFile=function(f){return new Promise(function(res){var fr=new FileReader();fr.onload=function(){res({name:f.name,text:String(fr.result||'')})};fr.onerror=function(){res({name:f.name,text:''})};fr.readAsText(f)})};
      Promise.all(bfl.map(readFile)).then(function(bfiles){
        return gs('repoBulkAdd',blinks,btitles,bfiles,btag);
      }).then(function(r){
        var msg=r.indexed+' indexed, '+r.queued+' queued (needs text)'+(r.errors&&r.errors.length?', '+r.errors.length+' error(s)':'');
        toast((r.noEmbedKey?'Add an API key in Settings to index automatically. ':'')+msg);
        return load(true);
      }).then(function(){render()}).catch(function(e){toast('Could not process batch: '+((e&&e.message)||e));b.disabled=false});
      return true;
    }
    if(act==='mnew'){var mid=newId('me'),mdoc={kind:'method',name:'',instructions:'',added:today()};S.assets[mid]=Object.assign({id:mid},mdoc);render();db.doc('assets/'+mid).set(mdoc).catch(function(){toast('Could not add')});return true}
    if(act==='sxtract'){
      var sxtext=$('#sx-text').value.trim(),sxlink=$('#sx-link').value.trim();
      if(!sxtext){toast('Paste the method text first');return true}
      b.disabled=true;S.scriptExtractBusy=true;render();
      gs('operatorExtract',sxtext,sxlink).then(function(r){
        S.scriptExtractBusy=false;
        if(r&&r.handoff){S.rdHandoff={type:'extract',docId:r.docId,docUrl:r.docUrl,sourceLink:sxlink,target:'script'};toast('No AI key set — opened a Doc for you');render();return}
        S.scriptDraft=r;render();
      }).catch(function(e){S.scriptExtractBusy=false;toast('Could not extract: '+((e&&e.message)||e));render()});
      return true;
    }
    if(act==='sxsave'){
      var sn=$('#sx-name').value.trim(),si=$('#sx-instr').value.trim();
      if(!sn||!si){toast('Needs a name and instructions');return true}
      var sid2=newId('me'),sdoc={kind:'method',name:sn,instructions:si,added:today()};
      S.assets[sid2]=Object.assign({id:sid2},sdoc);S.scriptDraft=null;render();db.doc('assets/'+sid2).set(sdoc).catch(function(){toast('Could not add')});
      return true;
    }
    if(act==='atask'){
      var a=S.assets[id];if(!a)return true;
      if(a.taskId&&S.items[a.taskId]){S.open=a.taskId;S.view='outline';persist();render();return true}
      if(!a.tag||!S.items[a.tag]){toast('Tag this item to a project or task first, so the task has a home');return true}
      var ttl=(a.need==='Need to buy'?'Buy: ':a.need==='Running low'?'Restock: ':'Sort out: ')+(a.name||'item')+(a.location?' ('+a.location+')':'');
      var ni=addItem(a.tag,ttl,a.due||'');aWrite(id,{taskId:ni});toast('Added to the outline'+(a.due?' and the calendar view':''));return true;
    }
    return false;
  }
  function whChange(t,act,k,id){
    if(act==='ltype'){dirWrite(id,{type:t.value});wmirror();return true}
    if(act==='aprio'){aWrite(id,{priority:t.value});render();return true}
    if(act==='aneed'){aWrite(id,{need:t.value});render();return true}

    if(act==='adue'){aWrite(id,{due:t.value});return true}
    if(k){var f=k.split(':')[0],m={aname:'name',aloc:'location',aqty:'qty',anotes:'notes',acontact:'contact',asells:'sells',apurl:'purchasesUrl',astored:'stored',apurch:'purchases',mname:'name',minstr:'instructions'},o={};

  function svgBar(d){var W=560,H=220,pad=30,vals=d.values||[],max=Math.max.apply(null,vals.concat([0.0001])),bw=(W-2*pad)/Math.max(vals.length,1);
    var bars=vals.map(function(v,i){var h=(v/max)*(H-2*pad),x=pad+i*bw,y=H-pad-h;return '<rect x="'+(x+2).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw-4).toFixed(1)+'" height="'+h.toFixed(1)+'" fill="var(--accent)"/><text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-pad+12)+'" font-size="9" text-anchor="middle" fill="var(--muted)">'+esc(String((d.labels||[])[i]||'').slice(0,10))+'</text>'}).join('');
    return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;max-width:560px;height:auto"><line x1="'+pad+'" y1="'+(H-pad)+'" x2="'+(W-pad)+'" y2="'+(H-pad)+'" stroke="var(--line)"/>'+bars+'</svg>';
  }
  function svgLine(d){var W=560,H=220,pad=30,vals=d.values||[],max=Math.max.apply(null,vals.concat([0.0001])),min=Math.min.apply(null,vals.concat([0])),rng=(max-min)||1;
    var pts=vals.map(function(v,i){var x=pad+(i/(Math.max(vals.length-1,1)))*(W-2*pad),y=H-pad-((v-min)/rng)*(H-2*pad);return x.toFixed(1)+','+y.toFixed(1)}).join(' ');
    return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;max-width:560px;height:auto"><line x1="'+pad+'" y1="'+(H-pad)+'" x2="'+(W-pad)+'" y2="'+(H-pad)+'" stroke="var(--line)"/><polyline points="'+pts+'" fill="none" stroke="var(--accent)" stroke-width="2"/></svg>';
  }
  function svgScatter(d){var W=560,H=220,pad=30,pts=d.points||[],xs=pts.map(function(p){return p.x}),ys=pts.map(function(p){return p.y});
    if(!pts.length)return '<p class="hint">No numeric points found.</p>';
    var xmin=Math.min.apply(null,xs),xmax=Math.max.apply(null,xs),ymin=Math.min.apply(null,ys),ymax=Math.max.apply(null,ys),xr=(xmax-xmin)||1,yr=(ymax-ymin)||1;
    function px(x){return pad+((x-xmin)/xr)*(W-2*pad)} function py(y){return H-pad-((y-ymin)/yr)*(H-2*pad)}
    var dots=pts.map(function(p){return '<circle cx="'+px(p.x).toFixed(1)+'" cy="'+py(p.y).toFixed(1)+'" r="3" fill="var(--accent)"/>'}).join('');
    var fitLine='';
    if(d.fit&&d.kind==='linear'){var x1=xmin,x2=xmax,y1=d.fit.m*x1+d.fit.b,y2=d.fit.m*x2+d.fit.b;fitLine='<line x1="'+px(x1).toFixed(1)+'" y1="'+py(y1).toFixed(1)+'" x2="'+px(x2).toFixed(1)+'" y2="'+py(y2).toFixed(1)+'" stroke="var(--red-fg)" stroke-width="2"/>'}
    else if(d.fit&&d.kind==='quadratic'){var steps=40,path='';for(var i=0;i<=steps;i++){var x=xmin+(i/steps)*(xmax-xmin),y=d.fit.a*x*x+d.fit.b*x+d.fit.c;path+=(i===0?'M':'L')+px(x).toFixed(1)+' '+py(y).toFixed(1)+' '}fitLine='<path d="'+path+'" fill="none" stroke="var(--red-fg)" stroke-width="2"/>'}

  function gcDesc(n){
    var bits=[];
    if(n.isComp){if(n.status)bits.push('Status: '+n.status);if(n.prize)bits.push('Prize: '+n.prize);if(n.fee)bits.push('Fee: '+n.fee);if(isUrl(n.url))bits.push(n.url)}
    else{if(n.status)bits.push('Status: '+n.status);if(n.priority)bits.push('Priority: '+n.priority);var pp=pathOf(n);if(pp.length)bits.push(pp.join(' > '));if(isUrl(n.link))bits.push(n.link)}
    if(n.notes)bits.push(n.notes);
    return bits.join('\n');
  }
  function gcError(e){return 'Calendar did not answer: '+((e&&e.message)||e||'error')+'. Press Sync now to retry.'}
  function gcSyncOne(id){
    var n=node(id);if(!n)return Promise.resolve();
    var want=gcWanted(n),cur=n.gcalId||'';
    if(want)return gs('gcalUpsert',{eventId:cur,title:gcTitle(n),desc:gcDesc(n),date:gcDate(n)}).then(function(nid){if(nid&&nid!==cur)return setFields(id,{gcalId:nid})});
    if(cur)return gs('gcalDelete',cur).then(function(){return setFields(id,{gcalId:''})});
    return Promise.resolve();
  }
  function gcDelete(n){
    if(!S.sync||!n.gcalId)return;
    var eid=n.gcalId;
    gcq=gcq.then(function(){return gs('gcalDelete',eid)}).catch(function(e){S.syncState='err';S.syncMsg=gcError(e);gcUI()});
  }
  function gcRun(ids){
    gcPending+=ids.length;S.syncState='busy';gcUI();
    ids.forEach(function(id){
      gcq=gcq.then(function(){return gcSyncOne(id)}).then(function(){gcDone++;gcPending--;if(!gcPending){S.syncState=gcErr?'err':'ok';S.syncMsg=gcErr||('Synced '+gcDone+' item'+(gcDone===1?'':'s'));gcDone=0;gcUI()}else gcUI()})
        .catch(function(e){gcPending--;gcErr=gcError(e);S.syncState='err';S.syncMsg=gcErr;if(!gcPending){gcDone=0}gcUI()});
    });
  }
  function scheduleSync(id){
    if(!S.sync)return;
    clearTimeout(gcTimers[id]);
    gcTimers[id]=setTimeout(function(){gcErr='';gcRun([id])},900);
  }
  function gcSyncAll(){
    gcErr='';
    var ids=allNodes().filter(function(n){return gcWanted(n)||n.gcalId}).map(function(n){return n.id});
    if(!ids.length){S.syncState='ok';S.syncMsg='Nothing with a deadline to sync';gcUI();return}
    gcRun(ids);
  }
  function gcUI(){
    var b=$('#gc-btn'),n=$('#gc-now'),m=$('#gc-msg');if(!b)return;
    b.textContent='Google Calendar: '+(S.sync?'on':'off');
    b.setAttribute('aria-pressed',S.sync);
    b.className='btn'+(S.sync?' primary':'');
    n.hidden=!S.sync;
    m.textContent=S.sync?(S.syncState==='busy'?'Syncing…':S.syncMsg):'';
    m.style.color=S.syncState==='err'?'var(--red-fg)':'';
  }
  $('#gc-btn').addEventListener('click',function(){
    S.sync=!S.sync;persist();
    if(S.sync){S.syncMsg='';gcSyncAll()}else{S.syncState='';S.syncMsg=''}
    gcUI();
  });
  $('#gc-now').addEventListener('click',gcSyncAll);
  $('#ticker-wrap').addEventListener('click',function(){S.view='calendar';S.calView='list';persist();render()});
  $('#side-up-tab').addEventListener('click',function(){S.sideUpOpen=!S.sideUpOpen;persist();sideUp()});
  $('#side-up-body').addEventListener('click',function(e){
    var r=e.target.closest('.side-up-row');if(!r)return;
    var kind=r.dataset.kind,rid=r.dataset.id;
    if(kind==='c'){S.copen=rid;S.view='calendar';S.calView='opps'}
    else{S.open=rid;S.view='outline'}
    persist();render();
  });
  document.addEventListener('click',function(e){document.querySelectorAll('details.help[open],details.focusmenu[open]').forEach(function(d){if(!d.contains(e.target))d.removeAttribute('open')})});
  $('#focus-disc').addEventListener('change',function(e){S.focus.disc=e.target.checked;if(S.focus.disc&&S.view==='disc')S.view='outline';persist();render();toast(S.focus.disc?'Discovery hidden':'Discovery shown')});
  $('#focus-rd').addEventListener('change',function(e){S.focus.rd=e.target.checked;if(S.focus.rd&&S.view==='rd')S.view='outline';persist();render();toast(S.focus.rd?'R&D hidden':'R&D shown')});

  $('#today').textContent=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  S.selDay=today();

  function gs(name){
    var args=[].slice.call(arguments,1);
    return new Promise(function(res,rej){
      var r=google.script.run.withSuccessHandler(res).withFailureHandler(rej);
      r[name].apply(r,args);
    });
  }
  db=null;var APPN='Atlas';
  /* ---------- boot ---------- */
  $('#view').innerHTML='<div class="sheet"><div class="empty"><h2>Loading your tracker</h2>One moment.</div></div>';
  var COLS=['items','comps','disc','agents','runs','dir','notes','cfg','chat','assets','canvas','rd','an'],cache={},subs={},sig={},inflight=0;COLS.forEach(function(c){cache[c]={};subs[c]=[];sig[c]=''});
  function emit(col){
    var s=JSON.stringify(cache[col]);if(s===sig[col])return;sig[col]=s;
    var docs=Object.keys(cache[col]).map(function(id){return {id:id,data:function(){return JSON.parse(JSON.stringify(cache[col][id]))}}});
    subs[col].forEach(function(f){f({docs:docs})});
  }
  function remote(col,id,fn){inflight++;return fn().then(function(r){inflight--;return r},function(e){inflight--;throw e})}
  /* Co-Create: items under a shared project root live in an external Sheet, not the local one. */
  function coShareAt(id){var n=cache.items[id],guard=0;while(n){if(n.coShare)return n.coShare;if(!n.parent)return null;n=cache.items[n.parent];if(guard++>20)return null}return null}
  function coShareFor(id){var n=cache.items[id];if(!n||!n.parent)return null;return coShareAt(n.parent)}
  db={
    collection:function(col){return {onSnapshot:function(ok){subs[col].push(ok);if(sig[col])ok({docs:[]});emit(col)}}},
    doc:function(path){
      var p=path.split('/'),col=p[0],id=p[1];
      return {
        set:function(d){cache[col][id]=JSON.parse(JSON.stringify(d));emit(col);
          var cs=(col==='items'&&d.parent)?coShareAt(d.parent):null;
          return remote(col,id,function(){return cs?gs('coSaveDoc',cs.sheetId,id,JSON.stringify(cache[col][id])):gs('saveDoc',col,id,JSON.stringify(cache[col][id]))})},
        update:function(d){cache[col][id]=Object.assign(cache[col][id]||{},JSON.parse(JSON.stringify(d)));emit(col);
          var cs=col==='items'?coShareFor(id):null;
          return remote(col,id,function(){return cs?gs('coSaveDoc',cs.sheetId,id,JSON.stringify(cache[col][id])):gs('saveDoc',col,id,JSON.stringify(cache[col][id]))})},
        delete:function(){var cs=col==='items'?coShareFor(id):null;delete cache[col][id];emit(col);
          return remote(col,id,function(){return cs?gs('coDeleteDoc',cs.sheetId,id):gs('deleteDoc',col,id)})}
      };
    }
  };
  function load(first){
    return gs('loadAll').then(function(r){
      if(!first&&inflight)return;
      COLS.forEach(function(c){var o={};Object.keys(r[c]||{}).forEach(function(id){o[id]=JSON.parse(r[c][id])});cache[c]=o});
      COLS.forEach(function(c){emit(c)});
    });
  }
  db.collection('items').onSnapshot(function(snap){rebuild(snap.docs);S.ready=true;render()});
  db.collection('comps').onSnapshot(function(snap){rebuildComps(snap.docs);render()});
  db.collection('disc').onSnapshot(function(snap){rebuildDisc(snap.docs);render()});
  ['agents','runs','dir','notes','cfg','assets','canvas','rd','an'].forEach(function(c){db.collection(c).onSnapshot(function(snap){rebuildGen(c,snap.docs);render()})});
  gs('keyStatus').then(function(k){S.keys=k;render()}).catch(function(){});
  load(true).then(function(){
    var lastErr=0;
    if(navigator.onLine!==false&&S.offQueue.length)offSyncNow();
    setInterval(function(){if(!document.hidden&&!inflight)load(false).then(function(){if(navigator.onLine!==false&&S.offQueue.length&&!S.offSyncing)offSyncNow()}).catch(function(){})},20000);
    if(sigEmpty())return;
  }).catch(function(e){$('#view').innerHTML='<div class="sheet"><div class="empty"><h2>Could not load the data</h2>'+esc((e&&e.message)||e)+'</div></div>'});
  function sigEmpty(){return false}
})();
</script>

</body></html>
